<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>[테스트] 20대 핵심역량 진단 — LOGIN LAB 연구소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#13203F;--accent:#2F6BFF;--soft:#DCE7FF;--tint:#EAF0FF;--line:#D6DCE6;--sub:#5B6478;--faint:#8E96A8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:16px}
button,input{font:inherit;color:inherit}
.dark{min-height:100vh;min-height:100dvh;background:var(--ink);color:#fff;padding:48px 24px}
.dark.center{display:flex;align-items:center}
.wrap{max-width:512px;margin:0 auto;width:100%}
.org{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--soft)}
h1{margin:0}
.h-xl{font-size:34px;font-weight:900;line-height:1.2;letter-spacing:-.02em;margin-top:20px}
.h-lg{font-size:30px;font-weight:900;line-height:1.25;letter-spacing:-.02em;margin-top:24px}
.h-md{font-size:28px;font-weight:900;line-height:1.3;margin-top:12px}
.lead{margin-top:14px;font-size:15px;line-height:1.65;color:rgba(255,255,255,.75)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:32px;text-align:center}
.stats div{background:rgba(255,255,255,.07);border-radius:16px;padding:16px 6px}
.stats b{display:block;font-size:24px;font-weight:900;color:var(--soft)}
.stats span{display:block;margin-top:4px;font-size:12px;color:rgba(255,255,255,.6)}
.card{margin-top:24px;background:#fff;color:#334155;border-radius:16px;padding:24px}
.card h2{margin:0;font-size:18px;font-weight:900;color:var(--ink)}
.card ol{margin:12px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.65}
.card li+li{margin-top:10px}
.card li b.n{color:var(--accent)}
.meet{margin-top:16px;border-radius:12px;padding:12px 16px;font-size:14px;background:var(--tint);color:var(--ink)}
.meet b{color:var(--accent);margin-right:8px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;min-height:52px}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.3;cursor:default}
.btn.light{background:var(--soft);color:var(--ink);margin-top:24px}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);margin-top:12px;font-size:14px;padding:14px}
.btn.ink{background:var(--ink);color:#fff;margin-top:32px}
.fine{margin-top:24px;text-align:center;font-size:12px;line-height:1.6;color:rgba(255,255,255,.45)}
.by{margin-top:10px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.35)}
.trust{margin-top:16px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.04);padding:20px}
.trust h2{margin:0;font-size:16px;font-weight:800;color:#fff}
.trust ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.trust li{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.72)}
.trust li b{display:block;margin-bottom:2px;font-size:12px;font-weight:800;color:var(--soft)}
.trust p{margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:700;color:rgba(255,255,255,.55)}
.anl ol{margin:28px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.anl li{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:rgba(255,255,255,.3);animation:anl-on .35s forwards;animation-delay:var(--d)}
.anl li i{position:relative;flex:0 0 22px;width:22px;height:22px;border:2px solid rgba(255,255,255,.2);border-radius:50%;animation:anl-dot .35s forwards;animation-delay:var(--d)}
.anl li i::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);opacity:0;animation:anl-ck .35s forwards;animation-delay:var(--d)}
@keyframes anl-on{to{color:#fff}}
@keyframes anl-dot{to{background:var(--accent);border-color:var(--accent)}}
@keyframes anl-ck{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.anl li,.anl li i,.anl li i::after{animation-duration:0s;animation-delay:0s}}
.form{margin-top:32px}
.field+.field{margin-top:20px}
.lbl{display:block;font-size:14px;font-weight:700;color:#334155}
.lbl small{font-weight:400;color:#94A3B8;font-size:14px}
.inp{margin-top:8px;width:100%;border:1px solid #CBD5E1;border-radius:12px;padding:12px 16px;font-size:16px;outline:none;background:#fff;color:var(--ink)}
.inp:focus{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid #CBD5E1;background:#fff;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;color:#64748B;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:transparent;color:#fff}
.agree{margin-top:20px;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:12px;padding:16px;display:grid;gap:12px}
.agree label{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.6;color:#475569;cursor:pointer}
.agree input{margin-top:4px;width:16px;height:16px;flex:0 0 16px;accent-color:#13203F}
.agree b{color:#1E293B}
.agree .more{border:0;background:none;padding:0;margin-left:6px;font-size:12px;color:#64748B;text-decoration:underline;cursor:pointer}
.agree .note{display:block;font-size:12px;color:#94A3B8;margin-top:2px}
.detail{background:#fff;border-radius:8px;padding:12px;font-size:12px;line-height:1.6;color:#64748B;box-shadow:0 0 0 1px #F1F5F9}
.detail p{margin:0}.detail p+p{margin-top:6px}.detail b{color:#475569}
.err{margin-top:16px;border-radius:12px;background:#FEF2F2;color:#DC2626;padding:12px 16px;font-size:14px}
.light-page{min-height:100vh;background:#fff;padding:40px 24px}
.light-page h1{font-size:24px;font-weight:900;color:var(--ink)}
.light-page .desc{margin-top:8px;font-size:14px;color:#64748B}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid #E2E8F0;padding:12px 24px}
.top .row{max-width:512px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#64748B}
.top .part{background:var(--tint);color:var(--accent);border-radius:999px;padding:2px 8px;font-size:11px;margin-right:8px}
.bar{max-width:512px;margin:8px auto 0;height:6px;border-radius:9px;background:#F1F5F9;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent);transition:width .2s}
.qs{max-width:512px;margin:0 auto;padding:32px 24px 140px}
fieldset{border:0;margin:0;padding:0}
fieldset+fieldset{margin-top:32px}
legend{padding:0;font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
legend .no{color:#CBD5E1;margin-right:8px}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.lk button{border:1px solid #E2E8F0;background:#fff;border-radius:12px;padding:12px 0;font-size:11px;font-weight:700;line-height:1.25;color:#64748B;cursor:pointer;min-height:48px}
.lk button span{display:block}
.lk button[aria-pressed="true"]{background:var(--ink);border-color:transparent;color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E2E8F0;padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px))}
.nav .row{max-width:512px;margin:0 auto;display:flex;gap:12px}
.nav button{border-radius:12px;padding:14px 24px;font-size:14px;font-weight:700;cursor:pointer;min-height:48px}
.nav .prev{border:1px solid #CBD5E1;background:#fff;color:#475569}
.nav .next{flex:1;border:0;background:var(--ink);color:#fff}
.nav .next:disabled{opacity:.3;cursor:default}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:rgba(255,255,255,.7);font-size:14px}
.white-card{margin-top:32px;background:#fff;color:var(--ink);border-radius:16px;padding:24px}
.white-card .lbl{color:var(--ink)}
.testbar{background:#FFF4D6;color:#7A5300;font-size:12px;font-weight:700;padding:8px 16px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 12px;text-align:center}
.testbar button{border:1px solid #E5C77A;background:#fff;color:#7A5300;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer}
</style>

<style>
.rp-page{width:540px;height:960px;position:relative;overflow:hidden;background:#F3F5FA;color:#1A2233;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;letter-spacing:-0.2px;-webkit-font-smoothing:antialiased;line-height:normal;font-size:14px;text-align:left}

.rp-page b{font-weight:800}

.rp-eyebrow{font-size:12px;font-weight:800;color:#2F6BFF;letter-spacing:1.5px}
.rp-h2{font-size:24px;font-weight:800;line-height:1.35;margin-top:6px;color:#1A2233}

.rp-method{margin:-28px 20px 0;padding:22px 22px 8px;position:relative}

.rp-step .t{font-size:14px;font-weight:800}
.rp-step .d{font-size:12.3px;color:#5B6478;line-height:1.5;margin-top:2px}

.rp-research{margin:14px 22px 0;font-size:11.2px;line-height:1.6;color:#7A8398;display:flex;gap:8px}

.rp-top{padding-top:34px}
.rp-type{margin:18px 20px 0;padding:22px;background:linear-gradient(150deg,#1E3264,#2F6BFF);color:#FFFFFF;border-radius:18px}

.rp-type .nm{font-size:25px;font-weight:900;line-height:1.3;margin-top:6px;letter-spacing:-0.6px}
.rp-type .ds{font-size:12.8px;line-height:1.55;margin-top:10px;opacity:.92}
.rp-scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 20px 0}

.rp-scores .l{font-size:11.5px;color:#5B6478;font-weight:700}
.rp-scores .v{font-size:30px;font-weight:900;margin-top:2px;letter-spacing:-1px}
.rp-scores .v small{font-size:14px;color:#9AA3B5;font-weight:700;margin-left:2px}
.rp-scores .s{font-size:11px;color:#5B6478;margin-top:2px}
.rp-bar{height:6px;border-radius:9px;background:#E8ECF4;margin-top:8px;position:relative;overflow:hidden}
.rp-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.rp-radar{margin:12px 20px 0;padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center}
.rp-legend{display:flex;gap:16px;font-size:11.5px;color:#5B6478;font-weight:700;margin-top:2px}
.rp-legend span{display:flex;align-items:center;gap:6px}
.rp-dgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;width:100%;margin-top:10px}
.rp-dchip{border-radius:12px;background:#F6F8FC;padding:9px 6px;text-align:center}
.rp-dchip .n{font-size:11px;font-weight:800;color:#5B6478}
.rp-dchip .v{font-size:20px;font-weight:900;margin-top:1px}
.rp-dchip .g{font-size:10.5px;font-weight:800;margin-top:1px}
.rp-subs{margin:16px 20px 0;padding:14px 18px 10px}
.rp-grp{padding:7px 0 6px;border-top:1px solid #E3E7EF}

.rp-row{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:10px;height:25px}

.rp-row .sc{font-size:13px;font-weight:800;text-align:right;white-space:nowrap}
.rp-bdg{font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:5px;margin-left:4px;vertical-align:1px}
.rp-good{background:#E3F6EF;color:#0E8A6A}
.rp-warnb{background:#FFEDDF;color:#D06A16}
.rp-interp{margin:12px 20px 0;padding:16px 18px}
.rp-interp h3{font-size:14.5px;font-weight:800}
.rp-it{display:flex;gap:10px;margin-top:11px}
.rp-it .k{flex:0 0 44px;font-size:11px;font-weight:800;padding:3px 0;border-radius:6px;text-align:center;height:22px}
.rp-it .x{font-size:12.6px;line-height:1.55;color:#2E3648}
.rp-pattern{margin:12px 20px 0;padding:15px 18px;border-radius:16px;background:#FFF7EC;border:1px dashed #F2B577}
.rp-pattern .l{font-size:11.5px;font-weight:800;color:#C2620F}
.rp-pattern .t{font-size:16px;font-weight:900;margin-top:3px}
.rp-pattern .x{font-size:12.6px;line-height:1.55;color:#4A3A28;margin-top:5px}
.rp-sub{font-size:12.8px;line-height:1.55;margin-top:8px;color:#5B6478}
.rp-lock{margin:9px 20px 0;padding:12px 16px;display:flex;gap:12px;align-items:center}

.rp-lock .t{font-size:14.2px;font-weight:800}
.rp-lock .s{font-size:11.5px;color:#5B6478;margin-top:1px}
.rp-redact{display:flex;gap:6px;margin-top:7px}
.rp-lock.tight{margin-top:7px;padding:9px 16px}.rp-lock.tight .rp-redact{margin-top:5px}
.rp-redact i{height:9px;border-radius:5px;background:#E3E8F1;display:block}
.rp-meet{margin:14px 20px 0;padding:16px 18px;border-radius:16px;background:#13203F;color:#FFFFFF}

.rp-meet .d{font-size:21px;font-weight:900;margin-top:4px;letter-spacing:-0.4px}

.rp-meet .g b{font-weight:700}

.rp-thanks{margin:12px 20px 0;padding:13px 18px;border-radius:16px;background:#EAF0FF}

.rp-ev{color:#6C4CF1}
.rp-vio{background:#EFEAFF;color:#5B3FD9}.rp-vio2{background:#F4F1FF;color:#7B66D9}.rp-tealb{background:#E2F4F7;color:#11788C}.rp-amb{background:#FFF1DC;color:#B4620E}

.rp-itype .l{font-size:12px;font-weight:700;opacity:.8}
.rp-itype .nm{font-size:25px;font-weight:900;line-height:1.3;margin-top:5px;letter-spacing:-0.6px}

  const saveDB = (rows) => { try { localStorage.setItem(TEST_DB, JSON.stringify(rows)); } catch (_) { throw new Error('브라우저 저장소에 저장하지 못했어요.'); } };
  const digits = (p) => String(p == null ? '' : p).replace(/\D/g, '');
  async function mockApi(action, d) {
    await new Promise((r) => setTimeout(r, 300));
    const rows = loadDB();
    // 비밀번호는 여기서 확인하지 않는다. 관리자 화면(test-admin.html)이 이 비밀번호로 암호를 풀 수 있을 때만 열린다.
    if (action === 'login') return { ok: true, token: d.password };
    if (action === 'find') {
      // 같은 사람에게 링크가 여러 개면 아직 응답하지 않은 것을 먼저
      const list = rows.filter((r) => r.name.trim() === d.name && digits(r.phone) === digits(d.phone)).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      const hit = list.find((r) => r.status === 'invited') || list[0];
      if (!hit) throw new Error('등록된 정보를 찾지 못했어요. 테스트 버전은 관리자 화면에서 먼저 링크를 만들어 주세요.');
      return { ok: true, id: hit.id };
    }
    const row = rows.find((r) => r.id === d.id);
    if (!row) throw new Error('검사 링크를 찾지 못했어요. 테스트 버전은 링크를 만든 브라우저에서만 열려요.');
    if (action === 'invite') return { ok: true, name: row.name, done: row.status === 'done', meeting: row.record.meeting || {} };
    // 응시자에게 보여줄 결과지 1장·3장에 필요한 것만 돌려준다 (2장 해석은 상담에서)
    if (action === 'result') {
      if (row.status !== 'done') throw new Error('아직 제출 전이에요.');
      const kst = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
      return {
        ok: true, name: row.name, reportNo: row.record.reportNo, testDate: kst.format(new Date(row.record.completedAt || row.createdAt)),
        status: row.situation, research: !!(row.record.meta && row.record.meta.researchConsent), meeting: row.record.meeting || {}, answers: row.answers,
      };
    }
    if (action === 'submit') {
      if (row.status === 'done') throw new Error('이미 제출된 검사입니다.');
      if (!d.clientName || d.clientName === SITE.adminName) throw new Error('이름을 다시 확인해 주세요.');
      Object.assign(row, { name: d.clientName, status: 'done', situation: d.status, answers: d.compAnswers.concat(d.ennAnswers) });
      row.record = Object.assign({}, row.record, {
        completedAt: new Date().toISOString(),
        meta: Object.assign(d.interest ? { interest: d.interest } : {}, { researchConsent: d.researchConsent === true }),
      });
      saveDB(rows);
      return { ok: true };
    }
    if (action === 'reset') {
      Object.assign(row, { status: 'invited', answers: [] });
      delete row.situation; delete row.record.completedAt; delete row.record.meta;
      saveDB(rows);
      return { ok: true };
    }
    throw new Error('알 수 없는 요청이에요.');
  }

  async function api(action, data) {
    if (TEST_MODE) return mockApi(action, data || {});
    if (!configured) throw new Error('index.html 맨 위의 API_URL 을 아직 넣지 않았어요.');
    let res;
    try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, data || {})) }); }
    catch (_) { throw new Error('인터넷 연결을 확인하고 다시 시도해 주세요.'); }
    const j = await res.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.error || '요청을 처리하지 못했어요.');
    return j;
  }
  function meetText(m) {
    if (!m || !m.date) return '';
    const [y, mo, d] = m.date.split('-').map(Number);
    const wd = '일월화수목금토'[new Date(y, mo - 1, d).getDay()];
    let t = '';
    if (m.time) { const [h, mi] = m.time.split(':').map(Number); t = ` ${h < 12 ? '오전' : '오후'} ${((h + 11) % 12) + 1}:${String(mi).padStart(2, '0')}`; }
    return `${mo}월 ${d}일 (${wd})${t}${m.place ? ' · ' + m.place : ''}`;
  }

  const id = new URLSearchParams(location.search).get('id');
  if (id) startTest(id); else renderEntry();

  /* ─── 첫 화면 (로그인 웹) ─────────────────────────────── */
  function renderEntry() {
    // 응시자와 관리자가 같은 칸을 쓴다: 이름에 '관리자'를 넣으면 연락처 칸에 넣은 값이 관리자 비밀번호가 된다
    const st = { name: '', phone: '', busy: false, err: '' };
    const isAdmin = () => st.name.trim() === SITE.adminName;
    const ready = () => (isAdmin() ? st.phone.trim().length > 0 : st.name.trim() && st.phone.replace(/\D/g, '').length >= 8);
    const draw = () => {
      app.innerHTML = `<main class="dark center"><div class="wrap">
        <p class="org">${esc(SITE.org)}</p>
        <h1 class="h-xl">20대<br>핵심역량 진단</h1>
        <p class="lead">안내받은 이름과 연락처를 입력하면 검사를 시작할 수 있어요.</p>
        <form class="white-card" id="f" novalidate>
          <div class="field"><label class="lbl" for="e-name">이름</label><input class="inp" id="e-name" maxlength="40" autocomplete="name" placeholder="홍길동" value="${esc(st.name)}"></div>
          <div class="field"><label class="lbl" for="e-phone">연락처</label><input class="inp" id="e-phone" maxlength="30" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" value="${esc(st.phone)}"></div>
          ${st.err ? `<p class="err" role="alert">${esc(st.err)}</p>` : ''}
          <button class="btn ink" type="submit" style="margin-top:20px" ${!ready() || st.busy ? 'disabled' : ''}>${st.busy ? '확인 중…' : '검사 시작하기'}</button>
        </form>
        <p class="fine">담당 연구원에게 받은 링크로 바로 들어와도 돼요.</p>
        <p class="by">${esc(SITE.org)} × ${esc(SITE.partner)} 공동 개발</p>
        ${configured ? '' : '<p class="err">설정 필요: index.html 맨 위의 API_URL 에 구글 Apps Script 웹 앱 주소를 넣어 주세요.</p>'}
      </div></main>`;
    };
    draw();
    app.oninput = (e) => {
      const t = e.target;
      if (t.id === 'e-name') st.name = t.value;
      if (t.id === 'e-phone') st.phone = t.value;
      st.err = '';
      app.querySelector('button[type=submit]').disabled = !ready();
      const er = app.querySelector('.err[role=alert]'); if (er) er.remove();
    };
    app.onsubmit = async (e) => {
      e.preventDefault();
      if (!ready()) return;
      st.busy = true; st.err = ''; draw();
      try {
        if (isAdmin()) {
          const j = await api('login', { password: st.phone.trim() });
          try { sessionStorage.setItem('ll_token', j.token); } catch (_) { /* 저장소를 못 쓰면 관리자 화면에서 다시 로그인 */ }
          location.href = TEST_MODE ? 'test-admin.html' : 'admin.html';
          return;
        }
        const j = await api('find', { name: st.name.trim(), phone: st.phone });
        location.href = '?id=' + encodeURIComponent(j.id);
      } catch (err) {
        st.busy = false; st.err = err.message; draw();
      }
    };
  }

    };

            : `<div class="card"><p style="margin:0;font-size:14px;color:#64748B">${S.resultErr ? esc(S.resultErr) : '결과지를 불러오는 중…'}</p></div>`}

        <div class="bar"><i style="width:${Math.round(answered / Q.INNER_TOTAL * 100)}%"></i></div></div>
        <div class="qs">${idx.map((i, k) => `<fieldset><legend><span class="no">${start + k + 1}</span>${esc(Q.questionText(i))}</legend>
          <div class="lk">${LIKERT.map(([v, l]) => `<button type="button" data-q="${i}" data-v="${v}" aria-pressed="${S.answers[i] === v}">${l.split('\n').map((x) => `<span>${x}</span>`).join('')}</button>`).join('')}</div></fieldset>`).join('')}
          ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}</div>
        <div class="nav"><div class="row">${S.page > 0 ? '<button class="prev" data-act="prev">이전</button>' : ''}<button class="next" data-act="next" ${!complete || S.busy ? 'disabled' : ''}>${S.busy ? '제출 중…' : last ? '제출하기' : '다음'}</button></div></div>
      </main>`;
    }

    async function submit() {
      const firstEmpty = Q.INNER_DISPLAY_ORDER.findIndex((i) => S.answers[i] === null);
      if (firstEmpty >= 0) { S.page = Math.floor(firstEmpty / PER_PAGE); S.err = '아직 응답하지 않은 문항이 있어 그 페이지로 이동했어요.'; draw(); return; }
      S.busy = true; S.err = ''; draw();
      try {
        const j = await api('submit', {
          id, clientName: S.name.trim(), status: S.status, interest: S.interest.trim(), researchConsent: S.research,
          compAnswers: S.answers.slice(0, Q.COMP_TOTAL), ennAnswers: S.answers.slice(Q.INNER_ENN_OFFSET)
        });
        clear(); S.already = !!j.already; S.busy = false;
        go('analyzing');
        await Promise.all([loadResult(), new Promise((r) => setTimeout(r, 2400))]);
        go('done');
      } catch (err) { S.busy = false; S.err = err.message; draw(); }
    }

    app.oninput = (e) => {
      const t = e.target;
      if (t.id === 't-name') S.name = t.value;
      if (t.id === 't-int') S.interest = t.value;
      const b = app.querySelector('[data-go="questions"]');
      if (b) b.disabled = !(S.name.trim() && S.status && S.consent);
    };
    app.onchange = (e) => {
      const t = e.target;
      if (t.id === 't-consent') { S.consent = t.checked; draw(); }
      if (t.id === 't-research') S.research = t.checked;
    };
    app.onclick = (e) => {
      const t = e.target.closest('button,[data-go]');
      if (!t) return;
      if (t.dataset.go) { if (t.dataset.go === 'questions') save(); go(t.dataset.go); return; }
      if (t.dataset.status) { S.status = t.dataset.status; draw(); return; }
      if (t.dataset.q) {
        S.answers[+t.dataset.q] = +t.dataset.v; save();
        t.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
        const start = S.page * PER_PAGE;
        const idx = Q.INNER_DISPLAY_ORDER.slice(start, Math.min(start + PER_PAGE, Q.INNER_TOTAL));
        const n = app.querySelector('[data-act="next"]'); if (n) n.disabled = !idx.every((i) => S.answers[i] !== null);
        const answered = S.answers.filter((a) => a !== null).length;
        const top = app.querySelector('.top .row span:last-child'); if (top) top.textContent = `${answered} / ${Q.INNER_TOTAL}`;
        const bar = app.querySelector('.bar i'); if (bar) bar.style.width = Math.round(answered / Q.INNER_TOTAL * 100) + '%';
        return;
      }
      const act = t.dataset.act;
      if (act === 'more') { e.preventDefault(); S.open = !S.open; draw(); }
      else if (act === 'restart') { clear(); S.answers = Array(Q.INNER_TOTAL).fill(null); S.page = 0; S.resumable = 0; go('form'); }
      else if (act === 'retest') { api('reset', { id }).then(() => { clear(); location.reload(); }, (err) => { S.err = err.message; draw(); }); }
      else if (act === 'part2') { S.page = PART2_PAGE; save(); go('questions'); }
      else if (act === 'prev') { S.page -= 1; S.err = ''; save(); draw(); window.scrollTo(0, 0); }
      else if (act === 'next') {
        if (S.page === PAGE_COUNT - 1) { submit(); return; }
        if (S.page + 1 === PART2_PAGE) { save(); go('break'); return; }
        S.page += 1; S.err = ''; save(); draw(); window.scrollTo(0, 0);
      }
    };
    draw();
    if (S.step === 'done') loadResult().then(draw);
  }

  /* 테스트 버전 전용 — 지금 페이지의 빈 문항을 무작위로 채움 */
  document.getElementById('autofill').onclick = () => {
    document.querySelectorAll('.lk').forEach((lk) => {
      if (!lk.querySelector('[aria-pressed="true"]')) lk.children[Math.floor(Math.random() * 5)].click();
    });
  };
})();
</script>
</body>
</html>
