<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13203F">
<title>20대 핵심역량 진단 — LOGIN LAB 연구소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#13203F;--accent:#2F6BFF;--soft:#DCE7FF;--tint:#EAF0FF;--line:#D6DCE6;--sub:#5B6478;--faint:#8E96A8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:16px}
button,input{font:inherit;color:inherit}
.dark{min-height:100vh;min-height:100dvh;background:var(--ink);color:#fff;padding:48px 24px}
.dark.center{display:flex;align-items:center}
.wrap{max-width:512px;margin:0 auto;width:100%}
.org{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--soft)}
h1{margin:0}
.h-xl{font-size:34px;font-weight:900;line-height:1.2;letter-spacing:-.02em;margin-top:20px}
.h-lg{font-size:30px;font-weight:900;line-height:1.25;letter-spacing:-.02em;margin-top:24px}
.h-md{font-size:28px;font-weight:900;line-height:1.3;margin-top:12px}
.lead{margin-top:14px;font-size:15px;line-height:1.65;color:rgba(255,255,255,.75)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:32px;text-align:center}
.stats div{background:rgba(255,255,255,.07);border-radius:16px;padding:16px 6px}
.stats b{display:block;font-size:24px;font-weight:900;color:var(--soft)}
.stats span{display:block;margin-top:4px;font-size:12px;color:rgba(255,255,255,.6)}
.card{margin-top:24px;background:#fff;color:#334155;border-radius:16px;padding:24px}
.card h2{margin:0;font-size:18px;font-weight:900;color:var(--ink)}
.card ol{margin:12px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.65}
.card li+li{margin-top:10px}
.card li b.n{color:var(--accent)}
.meet{margin-top:16px;border-radius:12px;padding:12px 16px;font-size:14px;background:var(--tint);color:var(--ink)}
.meet b{color:var(--accent);margin-right:8px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;min-height:52px}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.3;cursor:default}
.btn.light{background:var(--soft);color:var(--ink);margin-top:24px}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);margin-top:12px;font-size:14px;padding:14px}
.btn.ink{background:var(--ink);color:#fff;margin-top:32px}
.fine{margin-top:24px;text-align:center;font-size:12px;line-height:1.6;color:rgba(255,255,255,.45)}
.by{margin-top:10px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.35)}
.trust{margin-top:16px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.04);padding:20px}
.trust h2{margin:0;font-size:16px;font-weight:800;color:#fff}
.trust ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.trust li{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.72)}
.trust li b{display:block;margin-bottom:2px;font-size:12px;font-weight:800;color:var(--soft)}
.trust p{margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:700;color:rgba(255,255,255,.55)}
.anl ol{margin:28px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.anl li{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:rgba(255,255,255,.3);animation:anl-on .35s forwards;animation-delay:var(--d)}
.anl li i{position:relative;flex:0 0 22px;width:22px;height:22px;border:2px solid rgba(255,255,255,.2);border-radius:50%;animation:anl-dot .35s forwards;animation-delay:var(--d)}
.anl li i::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);opacity:0;animation:anl-ck .35s forwards;animation-delay:var(--d)}
@keyframes anl-on{to{color:#fff}}
@keyframes anl-dot{to{background:var(--accent);border-color:var(--accent)}}
@keyframes anl-ck{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.anl li,.anl li i,.anl li i::after{animation-duration:0s;animation-delay:0s}}
/* 시작 전 소개 — 탭해서 넘기는 이야기 */
.story{position:fixed;inset:0;overflow:hidden;background:var(--ink);color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.st-glow{position:absolute;left:50%;top:-22%;width:150vmax;height:78vh;transform:translateX(-50%);border-radius:50%;background-color:var(--g,#2F6BFF);filter:blur(90px);opacity:.34;transition:background-color 1.1s ease;pointer-events:none}
.st-top{position:absolute;left:0;right:0;top:0;z-index:2;padding:calc(14px + env(safe-area-inset-top)) 16px 0;max-width:560px;margin:0 auto}
.st-bars{display:flex;gap:4px}
.st-bars i{position:relative;flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.st-bars i.on::after{content:'';position:absolute;inset:0;background:#fff}
.st-bars i.now::after{animation:st-fill .6s ease both}
.st-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.5)}
.st-skip{border:0;border-radius:999px;background:rgba(255,255,255,.1);padding:7px 13px;font-size:12px;font-weight:700;letter-spacing:0;color:rgba(255,255,255,.85);cursor:pointer}
.st-stage{position:relative;z-index:1;height:100%;display:flex;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 22px calc(76px + env(safe-area-inset-bottom))}
.st-in{margin:auto;width:100%;max-width:440px;text-align:center}
.st-l{opacity:0;animation:st-up .75s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
.st-s{margin:0;font-size:16px;line-height:1.7;color:rgba(255,255,255,.62)}
.st-k{margin:0;font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--hl,#9DB8FF)}
.st-b{margin:16px 0;font-size:28px;font-weight:900;line-height:1.38;letter-spacing:-.025em}
.st-b em{font-style:normal;color:var(--hl,#9DB8FF)}
.st-tap{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));z-index:2;text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.42);animation:st-pulse 2.2s ease-in-out infinite;pointer-events:none}
.st-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:20px 0 18px;text-align:left}
.st-chip{position:relative;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.06);padding:12px 10px 11px}
.st-chip b{display:block;font-size:15px;font-weight:900;color:var(--c)}
.st-chip span{display:block;margin-top:4px;font-size:11px;line-height:1.45;color:rgba(255,255,255,.6)}
.st-chip.pick{border-color:var(--c);background:rgba(255,255,255,.13)}
.st-chip em{position:absolute;right:8px;top:-9px;border-radius:999px;background:var(--c);padding:2px 8px;font-size:10.5px;font-style:normal;font-weight:800;color:#fff}
.st-cent{display:grid;gap:10px;margin:20px 0 18px;text-align:left}
.st-c{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center;border-radius:16px;background:rgba(255,255,255,.06);padding:14px}
.st-c i{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c);font-size:13px;font-style:normal;font-weight:900;box-shadow:0 0 24px var(--c)}
.st-c b{display:block;font-size:16px;font-weight:900}
.st-c span{display:block;margin-top:2px;font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.62)}
.st-c small{display:block;margin-top:6px;font-size:11.5px;font-weight:800;color:var(--c)}
.st-dom{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:20px 0 18px;text-align:left}
.st-d{border-radius:16px;background:rgba(255,255,255,.06);padding:16px 14px;border-top:3px solid var(--c)}
.st-d small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--c)}
.st-d b{display:block;margin-top:4px;font-size:16px;font-weight:900}
.st-cap{margin:0;font-size:11.5px;color:rgba(255,255,255,.42)}
.st-facts{display:grid;gap:8px;margin:22px 0 0;padding:0;list-style:none;text-align:left}
.st-facts li{display:flex;gap:12px;align-items:center;border-radius:14px;background:rgba(255,255,255,.06);padding:13px 16px;font-size:14px;line-height:1.5;color:rgba(255,255,255,.82)}
.st-facts li b{flex:0 0 auto;min-width:30px;font-size:12px;font-weight:800;color:var(--hl,#9DB8FF)}
.st-go{margin-top:24px}
.st-by{margin:16px 0 0;font-size:11px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.38)}
@keyframes st-up{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes st-fill{from{transform:translateX(-100%)}to{transform:none}}
@keyframes st-pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.st-l,.st-bars i.now::after,.st-tap{animation:none;opacity:1}.st-glow{transition:none}}
@media (max-height:640px){.st-b{font-size:24px;margin:12px 0}.st-s{font-size:15px}.st-cent{gap:8px;margin:14px 0 12px}.st-c{padding:10px 12px}.st-c i{width:46px;height:46px}.st-c span{font-size:12px}}
.again{display:block;margin:20px auto 0;border:0;background:none;font-size:13px;font-weight:700;color:var(--soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.form{margin-top:32px}
.field+.field{margin-top:20px}
.lbl{display:block;font-size:14px;font-weight:700;color:#334155}
.lbl small{font-weight:400;color:#94A3B8;font-size:14px}
.inp{margin-top:8px;width:100%;border:1px solid #CBD5E1;border-radius:12px;padding:12px 16px;font-size:16px;outline:none;background:#fff;color:var(--ink)}
.inp:focus{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid #CBD5E1;background:#fff;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;color:#64748B;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:transparent;color:#fff}
.agree{margin-top:20px;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:12px;padding:16px;display:grid;gap:12px}
.agree label{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.6;color:#475569;cursor:pointer}
.agree input{margin-top:4px;width:16px;height:16px;flex:0 0 16px;accent-color:#13203F}
.agree b{color:#1E293B}
.agree .more{border:0;background:none;padding:0;margin-left:6px;font-size:12px;color:#64748B;text-decoration:underline;cursor:pointer}
.agree .note{display:block;font-size:12px;color:#94A3B8;margin-top:2px}
.detail{background:#fff;border-radius:8px;padding:12px;font-size:12px;line-height:1.6;color:#64748B;box-shadow:0 0 0 1px #F1F5F9}
.detail p{margin:0}.detail p+p{margin-top:6px}.detail b{color:#475569}
.err{margin-top:16px;border-radius:12px;background:#FEF2F2;color:#DC2626;padding:12px 16px;font-size:14px}
.light-page{min-height:100vh;background:#fff;padding:40px 24px}
.light-page h1{font-size:24px;font-weight:900;color:var(--ink)}
.light-page .desc{margin-top:8px;font-size:14px;color:#64748B}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid #E2E8F0;padding:12px 24px}
.top .row{max-width:512px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#64748B}
.top .part{background:var(--tint);color:var(--accent);border-radius:999px;padding:2px 8px;font-size:11px;margin-right:8px}
.bar{max-width:512px;margin:8px auto 0;height:6px;border-radius:9px;background:#F1F5F9;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent);transition:width .2s}
.qs{max-width:512px;margin:0 auto;padding:32px 24px 140px}
fieldset{border:0;margin:0;padding:0}
fieldset+fieldset{margin-top:32px}
legend{padding:0;font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
legend .no{color:#CBD5E1;margin-right:8px}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.tfills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin:0 0 24px}
.tfills .tfill{margin:0}
.pv{margin-top:24px}
.pv-t{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;font-weight:800;color:#fff}
.pv-t span{border-radius:999px;background:#F2862E;padding:2px 8px;font-size:11px;color:#fff}
.pv-crop{position:relative;overflow:hidden;border-radius:14px;max-height:620px}
.pv-crop::after{content:'';position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(rgba(19,32,63,0),var(--ink))}
/* 컨설팅 예약 신청 */
.cst{margin-top:28px;border-radius:16px;background:linear-gradient(135deg,rgba(220,231,255,.16),rgba(220,231,255,.04));border:1px solid rgba(220,231,255,.25);padding:20px}
.cst-t{margin:0;font-size:17px;font-weight:900;color:#fff}
.cst p{margin:6px 0 0;font-size:14px;line-height:1.65;color:rgba(255,255,255,.75)}
.cst .btn{margin-top:16px}
.dark.dn{padding-bottom:0}
.dn-nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;margin:24px -24px 0;padding:10px 24px;background:rgba(19,32,63,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
.dn-nav button{flex:1;min-height:40px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:transparent;color:rgba(255,255,255,.78);font-size:13px;font-weight:800;cursor:pointer}
.dn-nav button.on{background:var(--soft);border-color:transparent;color:var(--ink)}
.dn-sec{scroll-margin-top:64px}
.dn-head{padding-top:28px}
.dn-k{display:inline-block;border-radius:999px;background:rgba(220,231,255,.14);color:var(--soft);font-size:11px;font-weight:800;letter-spacing:.12em;padding:3px 10px}
.dn-h{margin:10px 0 0;font-size:22px;font-weight:900;color:#fff}
.dn-s{margin:6px 0 0;font-size:14px;line-height:1.6;color:rgba(255,255,255,.65)}
.dn-cf{margin-top:48px;padding:8px 0 48px;background:#1D2C52;box-shadow:0 0 0 100vmax #1D2C52;clip-path:inset(0 -100vmax);border-top:1px solid rgba(255,255,255,.08)}
.dn-cf .cf-card{margin-top:18px}
.chips.mbti{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.chips.mbti .chip{padding:10px 0;font-size:13px;letter-spacing:.04em}
.chips.mbti .chip:last-child{grid-column:1/-1;letter-spacing:0}
.cf-note{margin:0;font-size:13px;color:#94A3B8}
.cf-card{margin-top:28px;border-radius:18px;background:#fff;color:var(--ink);padding:28px 20px 24px}
.cf-title{margin:0;font-size:22px;font-weight:900;color:var(--ink)}
.cf-card .desc{margin-top:8px;font-size:14px;line-height:1.65;color:#64748B}
.cf-card .cf-sec:first-of-type{margin-top:16px;padding-top:0;border-top:0}
.cf-done{text-align:center;padding:12px 0}
.cf-done b{display:block;font-size:20px;font-weight:900;color:var(--ink)}
.cf-done p{margin:8px 0 0;font-size:14px;line-height:1.65;color:#64748B}
.cf-eye{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.16em;color:#94A3B8}
.cf-sec{margin:36px 0 16px;padding-top:24px;border-top:1px solid #E2E8F0;font-size:17px;font-weight:900;color:var(--ink)}
.req{font-style:normal;color:#DC2626}
.field.cf .lbl small{display:block;margin-top:2px;font-size:13px}
.chips.col{flex-direction:column;align-items:stretch}
.chips.col .chip{text-align:left}
.ta{min-height:110px;resize:vertical;line-height:1.6;font-family:inherit}
.field.cf .err{margin-top:8px;padding:8px 12px;font-size:13px}
.btn.ghost-ink{background:transparent;border:1px solid #CBD5E1;color:#475569;margin-top:12px;font-size:15px}
.cf-ok{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff}
.st-pv{position:relative;height:min(300px,38vh);overflow:hidden;border-radius:14px;margin:16px 0 14px;text-align:left}
.st-pv::after{content:'';position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(rgba(19,32,63,0),rgba(19,32,63,.96))}
.st-pv .ap-page{border-radius:14px}
.st-pv .ap-run,.st-pv .ap-intro{display:none}
.st-pv .ap-hero{margin-top:0}
.st-pv-t{display:inline-block;border-radius:999px;background:#F2862E;color:#fff;font-size:11px;font-weight:800;padding:2px 9px;margin-left:6px;vertical-align:3px}
.qnote{margin:0 0 4px;border-radius:12px;background:var(--tint);padding:12px 14px;font-size:14px;line-height:1.6;color:var(--ink)}
.pv-crop .ap-page{border-radius:14px}
.pv-s{margin:10px 0 0;font-size:13px;line-height:1.6;color:rgba(255,255,255,.7)}
.tfill{display:block;margin:0 0 24px auto;border:1px dashed #CBD5E1;border-radius:999px;background:#F8FAFC;padding:6px 14px;font-size:12px;font-weight:700;color:#64748B;cursor:pointer}
.lk button{border:1px solid #E2E8F0;background:#fff;border-radius:12px;padding:12px 0;font-size:11px;font-weight:700;line-height:1.25;color:#64748B;cursor:pointer;min-height:48px}
.lk button span{display:block}
.lk button[aria-pressed="true"]{background:var(--ink);border-color:transparent;color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E2E8F0;padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px))}
.nav .row{max-width:512px;margin:0 auto;display:flex;gap:12px}
.nav button{border-radius:12px;padding:14px 24px;font-size:14px;font-weight:700;cursor:pointer;min-height:48px}
.nav .prev{border:1px solid #CBD5E1;background:#fff;color:#475569}
.nav .next{flex:1;border:0;background:var(--ink);color:#fff}
.nav .next:disabled{opacity:.3;cursor:default}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:rgba(255,255,255,.7);font-size:14px}
.white-card{margin-top:32px;background:#fff;color:var(--ink);border-radius:16px;padding:24px}
.white-card .lbl{color:var(--ink)}
</style>
<!-- 결과지 스타일 (자동 생성 — 직접 고치지 마세요) -->
<style>
.rp-page{width:540px;height:960px;position:relative;overflow:hidden;background:#F3F5FA;color:#1A2233;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;letter-spacing:-0.2px;-webkit-font-smoothing:antialiased;line-height:normal;font-size:14px;text-align:left}
.rp-page *{box-sizing:border-box;margin:0;padding:0}
.rp-page b{font-weight:800}
.rp-pad{padding:0 28px}
.rp-pageno{position:absolute;bottom:18px;right:28px;font-size:11px;color:#9AA3B5;letter-spacing:1px}
.rp-brand{position:absolute;bottom:18px;left:28px;font-size:11px;color:#9AA3B5;font-weight:700;letter-spacing:.5px}
.rp-eyebrow{font-size:12px;font-weight:800;color:#2F6BFF;letter-spacing:1.5px}
.rp-h2{font-size:24px;font-weight:800;line-height:1.35;margin-top:6px;color:#1A2233}

  }

  // 구글 서버는 한동안 쉬다가 받은 첫 요청이 느리다 — 화면이 열리자마자 미리 깨워 둔다 (응답은 쓰지 않는다)
  if (configured) fetch(API_URL, { mode: 'no-cors' }).catch(() => {});
  const id = new URLSearchParams(location.search).get('id');
  if (id) startTest(id); else renderEntry();

  /* ─── 첫 화면 (로그인 웹) ─────────────────────────────── */
  function renderEntry() {
    // 응시자와 관리자가 같은 칸을 쓴다: 이름에 '관리자'를 넣으면 연락처 칸에 넣은 값이 관리자 비밀번호가 된다
    const st = { name: '', phone: '', busy: false, err: '' };
    const isAdmin = () => st.name.trim() === SITE.adminName;
    const isTest = () => st.name.trim() === SITE.testName && st.phone.replace(/\D/g, '') === SITE.testPhone;
    const ready = () => (isAdmin() ? st.phone.trim().length > 0 : isTest() || (st.name.trim() && st.phone.replace(/\D/g, '').length >= 8));
    const draw = () => {
      app.innerHTML = `<main class="dark center"><div class="wrap">
        <p class="org">${esc(SITE.org)}</p>
        <h1 class="h-xl">20대<br>핵심역량 진단</h1>
        <p class="lead">안내받은 이름과 연락처를 입력하면 검사를 시작할 수 있어요.</p>
        <form class="white-card" id="f" novalidate>
          <div class="field"><label class="lbl" for="e-name">이름</label><input class="inp" id="e-name" maxlength="40" autocomplete="name" placeholder="홍길동" value="${esc(st.name)}"></div>
          <div class="field"><label class="lbl" for="e-phone">연락처</label><input class="inp" id="e-phone" maxlength="30" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" value="${esc(st.phone)}"></div>
          ${st.err ? `<p class="err" role="alert">${esc(st.err)}</p>` : ''}
          <button class="btn ink" type="submit" style="margin-top:20px" ${!ready() || st.busy ? 'disabled' : ''}>${st.busy ? '확인 중…' : '검사 시작하기'}</button>
        </form>
        <p class="fine">담당 연구원에게 받은 링크로 바로 들어와도 돼요.</p>
        <p class="by">${esc(SITE.org)} × ${esc(SITE.partner)} 공동 개발</p>
        ${configured ? '' : '<p class="err">설정 필요: index.html 맨 위의 API_URL 에 구글 Apps Script 웹 앱 주소를 넣어 주세요.</p>'}
      </div></main>`;
    };
    draw();
    app.oninput = (e) => {
      const t = e.target;
      if (t.id === 'e-name') st.name = t.value;
      if (t.id === 'e-phone') st.phone = t.value;
      st.err = '';
      app.querySelector('button[type=submit]').disabled = !ready();
      const er = app.querySelector('.err[role=alert]'); if (er) er.remove();
    };
    app.onsubmit = async (e) => {
      e.preventDefault();
      if (!ready()) return;
      st.busy = true; st.err = ''; draw();
      try {
        if (isAdmin()) {
          const j = await api('login', { password: st.phone.trim(), withList: true });
          // 관리자 화면은 이 비밀번호로 잠금을 풀고, 서버 요청에는 토큰을 쓴다. 함께 받은 명단은 관리자 화면이 바로 보여준다.
          try {
            sessionStorage.setItem('ll_token', j.token); sessionStorage.setItem('ll_pw', st.phone.trim()); sessionStorage.setItem('ll_consult', j.consultUrl || '');
            if (Array.isArray(j.rows)) sessionStorage.setItem('ll_rows', JSON.stringify({ at: Date.now(), rows: j.rows, login: true }));
          } catch (_) { /* 저장소를 못 쓰면 관리자 화면에서 다시 입력 */ }
          location.href = 'admin.html';
          return;
        }
        const j = await api('find', { name: st.name.trim(), phone: st.phone });
        try { sessionStorage.setItem('ll-ok-' + j.id, '1'); sessionStorage.setItem('ll-fresh-' + j.id, '1'); sessionStorage.setItem('ll-ph-' + j.id, st.phone.replace(/\D/g, '')); } catch (_) { /* 저장소를 못 쓰면 링크 화면에서 한 번 더 확인 */ }
        location.href = '?id=' + encodeURIComponent(j.id);
      } catch (err) {
        st.busy = false; st.err = err.message; draw();
      }
    };
  }

  /* ─── 링크로 들어온 사람 확인 ─────────────────────────────── */
  // 안내받은 이름과 연락처가 이 링크의 것과 같아야 다음(소개 이야기 · 검사)으로 넘어간다
  function verify(id, inv) {
    return new Promise((resolve) => {
      const st = { name: '', phone: '', busy: false, err: '' };
      const ready = () => st.name.trim() && st.phone.replace(/\D/g, '').length >= 4;
      const draw = () => {
        app.innerHTML = `<main class="dark center"><div class="wrap">
          <p class="org">${esc(SITE.org)}</p>
          <h1 class="h-xl">20대<br>핵심역량 진단</h1>
          <p class="lead">${inv.done ? '결과를 보려면' : '진단을 시작하려면'} 안내받은 이름과 연락처를 입력해 주세요.</p>
          <form class="white-card" id="vf" novalidate>
            <div class="field"><label class="lbl" for="v-name">이름</label><input class="inp" id="v-name" maxlength="40" autocomplete="name" placeholder="홍길동" value="${esc(st.name)}"></div>
            <div class="field"><label class="lbl" for="v-phone">연락처</label><input class="inp" id="v-phone" maxlength="30" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" value="${esc(st.phone)}"></div>
            ${st.err ? `<p class="err" role="alert">${esc(st.err)}</p>` : ''}
            <button class="btn ink" type="submit" style="margin-top:20px" ${!ready() || st.busy ? 'disabled' : ''}>${st.busy ? '확인 중…' : '확인'}</button>
          </form>
          <p class="by">${esc(SITE.org)} × ${esc(SITE.partner)} 공동 개발</p>
        </div></main>`;
      };
      draw();
      app.oninput = (e) => {
        const t = e.target;
        if (t.id === 'v-name') st.name = t.value;
        if (t.id === 'v-phone') st.phone = t.value;
        st.err = '';
        app.querySelector('button[type=submit]').disabled = !ready();
        const er = app.querySelector('.err[role=alert]'); if (er) er.remove();
      };
      app.onsubmit = async (e) => {
        e.preventDefault();
        if (!ready() || st.busy) return;
        st.busy = true; st.err = ''; draw();
        try {
          const j = await api('find', { name: st.name.trim(), phone: st.phone });
          if (j.id !== id) throw new Error('이 링크로 안내받은 이름과 연락처가 아니에요. 다시 확인해 주세요.');
          try { sessionStorage.setItem('ll-ph-' + id, st.phone.replace(/\D/g, '')); sessionStorage.setItem('ll-fresh-' + id, '1'); } catch (_) { /* 무시 */ }
          app.oninput = null; app.onsubmit = null;
          resolve();
        } catch (err) { st.busy = false; st.err = err.message; draw(); }
      };
    });
  }

  /* ─── 검사 ───────────────────────────────────────────── */
  async function startTest(id) {
    let inv;
    try { inv = await api('invite', { id }); }
    catch (err) {
      app.innerHTML = `<main class="dark center"><div class="wrap"><p class="org">${esc(SITE.org)}</p><h1 class="h-md">검사 링크를 열 수 없어요</h1><p class="lead">${esc(err.message)}</p><a class="btn light" href="./" style="text-align:center;text-decoration:none">첫 화면으로</a></div></main>`;
      return;
    }
    // 링크로 바로 들어왔으면 이름·연락처부터 확인한다 (첫 화면에서 입력하고 넘어왔으면 이미 확인됨)
    const OK_KEY = 'll-ok-' + id;
    let okd = false;
    try { okd = sessionStorage.getItem(OK_KEY) === '1'; } catch (_) { /* 무시 */ }
    if (!okd) {
      await verify(id, inv);
      try { sessionStorage.setItem(OK_KEY, '1'); } catch (_) { /* 무시 */ }
    }
    const KEY = 'll-draft-' + id;
    const S = {
      step: inv.done ? 'done' : 'intro', name: inv.name, status: '', interest: '', consent: false, research: false, open: false,
      answers: Array(Q.TOTAL).fill(null), page: 0, busy: false, err: '', resumable: 0, already: inv.done
    };
    const meeting = meetText(inv.meeting);
    const STORY_KEY = 'll-story-' + id;
    if (!inv.done) {
      try {
        const d = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (d && Array.isArray(d.answers) && d.answers.length === Q.TOTAL && Date.now() - d.savedAt < DRAFT_TTL) {
          const n = d.answers.filter((a) => a !== null).length;
          if (n) { S.answers = d.answers; S.page = Math.min(Math.max(d.page || 0, 0), PAGE_COUNT - 1); S.status = d.status || ''; S.interest = d.interest || ''; S.resumable = n; }
        }
      } catch (_) { /* 저장소를 못 쓰는 브라우저 */ }
      // 이름·연락처를 넣고 막 들어왔을 때마다 소개 이야기부터 (‘다시 해보기’도 마찬가지 · 같은 창에서 새로 고침하면 바로 초대 화면)
      let fresh = false;
      try { fresh = sessionStorage.getItem('ll-fresh-' + id) === '1'; sessionStorage.removeItem('ll-fresh-' + id); } catch (_) { /* 무시 */ }
      if (fresh) { S.step = 'story'; S.slide = 0; }
    }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ savedAt: Date.now(), answers: S.answers, page: S.page, status: S.status, interest: S.interest })); } catch (_) { /* 무시 */ } };
    const clear = () => { try { localStorage.removeItem(KEY); } catch (_) { /* 무시 */ } };
    const go = (step) => { S.step = step; S.err = ''; draw(); window.scrollTo(0, 0); };

    // 제출 뒤 결과지: 1장은 그대로, 2장은 가린 채로, 3장(상담 안내)은 그대로 보여준다
    async function loadResult() {
      try { S.res = await api('result', { id }); S.pages = LLP.participantPages(S.res); S.resultErr = S.pages ? '' : '결과지를 만들지 못했어요.'; }
      catch (err) { S.pages = null; S.resultErr = err.message; }
    }
    // 결과지 한 장(540×960)을 화면 너비에 맞춰 줄인다
    const fitPages = () => app.querySelectorAll('.ptc-fit').forEach((el) => {
      const s = el.clientWidth / 540;
      el.style.height = Math.round(960 * s) + 'px';
      el.firstElementChild.style.transform = `scale(${s})`;
    });
    window.addEventListener('resize', fitPages);

    // 시작 전에 ‘이런 결과지를 받아요’ — 내 이름으로 만든 1장 예시 (응답은 예시 값)
    function samplePage1() {
      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      const p = LLP.participantPages({ name: S.name || inv.name, reportNo: 'LL-예시', testDate: today, status: '대학생', research: true, meeting: {}, answers: LLP.sampleAnswers(2) });
      return p ? p[0] : '';
    }
    function previewHTML() {
      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      const p = LLP.participantPages({ name: S.name || inv.name, reportNo: 'LL-예시', testDate: today, status: '대학생', research: true, meeting: {}, answers: LLP.sampleAnswers(2) });
      return p ? `<div class="pv"><p class="pv-t">검사가 끝나면 이런 결과지를 바로 받아요 <span>예시</span></p><div class="pv-crop"><div class="ap-fluid">${p[0]}</div></div><p class="pv-s">내 응답으로 만든 1장 ‘한눈에 보는 나’가 검사 직후 열리고, 9가지 성향 풀이·핵심역량·직무 추천이 담긴 전체 결과지는 1:1 상담에서 함께 봐요.</p></div>` : '';
    }

    // ─── 컨설팅 예약 신청 (결과 화면 맨 아래) — 보기는 서버 Code.gs 의 CONSULT_OPTS 와 같아야 해요 ───
    const CF = {
      interests: ['취업', '창업', '자기계발', '인간관계', '이직'],
      goals: ['진로 방향 설정', '구체적인 취업 전략', '멘탈 코칭 및 케어', '자기계발'],
      evening: ['저녁엔 모임이나 약속이 많아 일정 잡기 어려움', '주 2~3회 정도는 비울 수 있음', '평일 저녁은 대부분 자유로움', '오히려 늦은 밤(21시 이후)에 여유가 있음'],
      premium: ['희망함', '희망하지 않음'],
      gender: ['남성', '여성'],
      times: ['오전 (8–12시)', '오후 (12–17시)', '저녁 (17–21시)', '불규칙해서 협의가 필요해요'],
      notes: ['정신과 약 복용중', '정신과 상담 고민중', '심리상담 개별 진행중', '해당사항 없음'],
      mbti: ['ISTJ', 'ISFJ', 'INFJ', 'INTJ', 'ISTP', 'ISFP', 'INFP', 'INTP', 'ESTP', 'ESFP', 'ENFP', 'ENTP', 'ESTJ', 'ESFJ', 'ENFJ', 'ENTJ', '잘 모르겠어요'],
    };
    const CF_KEY = 'll-consult-' + id;
    const consulted = () => { try { return sessionStorage.getItem(CF_KEY) === '1'; } catch (_) { return false; } };
    function cfInit() {
      if (S.cf) return;
      // 이 창에서 이미 보낸 신청서가 있으면 그 내용으로 (고쳐서 다시 보낼 때)
      try { const sent = JSON.parse(sessionStorage.getItem(CF_KEY + '-form') || 'null'); if (sent && Array.isArray(sent.interests)) { S.cf = sent; return; } } catch (_) { /* 무시 */ }
      let ph = '';
      try { ph = sessionStorage.getItem('ll-ph-' + id) || ''; } catch (_) { /* 무시 */ }
      S.cf = { name: S.name.trim() || inv.name, phone: ph, birthday: '', university: '', location: '', interests: [], timeInvestment: '', weeklyFixed: '', concern: '',
        goals: [], goalsOther: '', plans: '', evening: '', premium: '', gender: '', times: [], notes: [], notesOther: '', mbti: '' };
    }
    function cfErrors() {
      const f = S.cf, E = {}, has = (v) => String(v || '').trim().length > 0;
      if (!has(f.name)) E.name = '성함을 입력해 주세요.';
      const d = f.phone.replace(/\D/g, ''); if (d.length < 9 || d.length > 11) E.phone = '전화번호를 다시 확인해 주세요.';
      if (!has(f.birthday)) E.birthday = '생년월일을 입력해 주세요.';
      if (!has(f.location)) E.location = '사는 곳을 입력해 주세요.';
      if (!f.interests.length) E.interests = '관심 분야를 하나 이상 선택해 주세요.';
      if (!has(f.timeInvestment)) E.timeInvestment = '내용을 입력해 주세요.';
      if (!has(f.weeklyFixed)) E.weeklyFixed = '내용을 입력해 주세요.';
      if (!has(f.concern)) E.concern = '고민을 적어 주세요.';
      if (!f.goals.length) E.goals = '하나 이상 선택해 주세요.'; else if (f.goals.includes('기타') && !has(f.goalsOther)) E.goals = '기타 내용을 적어 주세요.';
      if (!has(f.plans)) E.plans = '내용을 입력해 주세요.';
      if (!f.evening) E.evening = '하나를 선택해 주세요.';
      if (!f.premium) E.premium = '선택해 주세요.';
      if (!f.gender) E.gender = '선택해 주세요.';
      if (!f.times.length) E.times = '시간대를 하나 이상 선택해 주세요.';
      if (!f.notes.length) E.notes = '하나 이상 선택해 주세요.'; else if (f.notes.includes('기타') && !has(f.notesOther)) E.notes = '기타 내용을 적어 주세요.';
      return E;
    }
    // 결과 화면 위쪽 버튼에 지금 보고 있는 구역(결과지 / 신청서)을 표시
    let navScroll = null;
    function watchNav() {
      if (navScroll) window.removeEventListener('scroll', navScroll);
      const nav = document.getElementById('dn-nav'), cf = document.getElementById('sec-cf');
      if (!nav || !cf) return;
      navScroll = () => { const on = cf.getBoundingClientRect().top < window.innerHeight * 0.45; nav.querySelectorAll('button').forEach((b) => b.classList.toggle('on', (b.dataset.to === 'sec-cf') === on)); };
      window.addEventListener('scroll', navScroll, { passive: true });
      navScroll();
    }
    // 결과 화면 아래 신청서 카드만 다시 그린다 (결과지는 그대로)
    const drawCf = () => { const box = document.getElementById('cf'); if (box) box.innerHTML = consultHTML(); else draw(); };
    async function cfSubmit() {
      const E = cfErrors();
      if (Object.keys(E).length) {
        S.cerr = E; S.err = '빠진 항목이 있어요. 표시된 곳을 확인해 주세요.'; drawCf();
        const el = document.getElementById('cf-' + Object.keys(E)[0]); if (el) el.scrollIntoView({ block: 'center' });
        return;
      }
      const f = S.cf, other = (a, t) => a.map((x) => (x === '기타' ? '기타: ' + t.trim() : x));
      let summary = '';
      try { summary = S.res ? LLP.summaryOf(S.res.answers) : ''; } catch (_) { /* 무시 */ }
      S.busy = true; S.err = ''; S.cerr = {}; drawCf();
      try {
        await api('consult', { id, form: {
          name: f.name.trim(), phone: f.phone, birthday: f.birthday.trim(), university: f.university.trim(), location: f.location.trim(),
          interests: f.interests, timeInvestment: f.timeInvestment.trim(), weeklyFixed: f.weeklyFixed.trim(), concern: f.concern.trim(),
          goals: other(f.goals, f.goalsOther), plans: f.plans.trim(), evening: f.evening, premium: f.premium, gender: f.gender,
          times: f.times, notes: other(f.notes, f.notesOther), mbti: f.mbti || '', summary,
        } });
        try { sessionStorage.setItem(CF_KEY, '1'); sessionStorage.setItem(CF_KEY + '-form', JSON.stringify(S.cf)); } catch (_) { /* 무시 */ }
        S.busy = false; S.cfEdit = false; drawCf();
        const box = document.getElementById('cf'); if (box) box.scrollIntoView({ block: 'start' });
      } catch (err) { S.busy = false; S.err = err.message; drawCf(); }
    }
    function consultHTML() {
      cfInit();
      if (consulted() && !S.cfEdit) {
        return `<div class="cf-done"><div class="cf-ok">✓</div><b>신청 완료!</b><p>담당 컨설턴트가 검토 후<br>입력하신 번호로 연락드립니다. 감사합니다.</p><button type="button" class="btn ghost-ink" data-act="cf-again">내용 고쳐서 다시 보내기</button></div>`;
      }
      const f = S.cf, E = S.cerr || {};
      const multi = (k, opts, other) => `<div class="chips">${opts.concat(other ? ['기타'] : []).map((o) => `<button type="button" class="chip" data-cf="${k}" data-v="${esc(o)}" aria-pressed="${f[k].includes(o)}">${esc(o)}</button>`).join('')}</div>${other && f[k].includes('기타') ? `<input class="inp" data-cfo="${k}" maxlength="100" placeholder="직접 적어 주세요" value="${esc(f[k + 'Other'])}">` : ''}`;
      const one = (k, opts) => `<div class="chips${opts.some((o) => o.length > 10) ? ' col' : ''}">${opts.map((o) => `<button type="button" class="chip" data-cs="${k}" data-v="${esc(o)}" aria-pressed="${f[k] === o}">${esc(o)}</button>`).join('')}</div>`;
      const inp = (k, ph = '', extra = '') => `<input class="inp" data-cfi="${k}" maxlength="${k === 'name' ? 40 : 300}" placeholder="${esc(ph)}" value="${esc(f[k])}" ${extra}>`;
      const ta = (k, ph = '') => `<textarea class="inp ta" data-cfi="${k}" maxlength="2000" placeholder="${esc(ph)}">${esc(f[k])}</textarea>`;
      const fld = (k, label, body, req = true, hint = '') => `<div class="field cf" id="cf-${k}"><p class="lbl">${label}${req ? ' <i class="req">*</i>' : ''}${hint ? `<small>${hint}</small>` : ''}</p>${body}${E[k] ? `<p class="err">${esc(E[k])}</p>` : ''}</div>`;
      return `<p class="cf-note"><i class="req">*</i> 표시는 꼭 적어 주세요.</p>

        const steps = [`${Q.ENN_N}문항으로 9가지 성향 점수 계산`, '행동·관계·생각 세 가지 중심 찾기', `스트레스 대처 ${Q.TOTAL - Q.ENN_N}문항 정리`, '결과지 1장 ‘한눈에 보는 나’ 만들기'];
        app.innerHTML = `<main class="dark center"><div class="wrap anl" role="status" aria-live="polite">
          <p class="org" style="letter-spacing:0;font-size:14px">제출 완료</p>
          <h1 class="h-md">${esc(S.name.trim() || inv.name)} 님의<br>결과지를 만들고 있어요</h1>
          <ol>${steps.map((t, i) => `<li style="--d:${(0.2 + i * 0.55).toFixed(2)}s"><i></i>${t}</li>`).join('')}</ol>
          <p class="fine" style="margin-top:40px">${esc(SITE.basis)} 역량 분류 기반</p>
          <p class="by">${esc(SITE.org)} × ${esc(SITE.partner)} 공동 개발</p>
        </div></main>`;
        return;
      }
      if (S.step === 'done') {
        const fine = `<p class="fine">이 진단은 ${esc(SITE.org)}와 상담 단체 ${esc(SITE.partner)}가 함께 만들었어요.<br>${esc(SITE.basis)} 역량 분류 기반 · ${Q.TOTAL}문항</p>`;
        app.innerHTML = `<main class="dark dn"><div class="wrap">
          <p class="org" style="letter-spacing:0;font-size:14px">${S.already ? '이미 제출했어요' : '제출 완료'}</p>
          <h1 class="h-md">${esc(S.name.trim() || inv.name)} 님의<br>결과지가 나왔어요</h1>
          <p class="lead">1장 ‘한눈에 보는 나’는 지금 바로 볼 수 있어요. 9가지 성향 풀이, 성격 구조, 스트레스 대처, 핵심역량·직무 추천이 담긴 전체 결과지는 <b style="color:#fff">1:1 상담에서 연구원이 직접 열어 설명</b>해 드려요.</p>
          ${S.pages ? '<nav class="dn-nav" id="dn-nav" aria-label="결과 화면 구역"><button type="button" class="on" data-act="jump" data-to="sec-res">① 내 결과지</button><button type="button" data-act="jump" data-to="sec-cf">② 컨설팅 예약 신청</button></nav>' : ''}
          <section class="dn-sec" id="sec-res"><div class="dn-head"><span class="dn-k">STEP 1</span><h2 class="dn-h">내 결과지</h2><p class="dn-s">1장은 지금 바로 · 2·3장은 1:1 상담에서 함께 열어요</p></div>
          ${S.pages
            ? `<div class="ptc-stack">${S.pages.map((p, i) => `<p class="ptc-label">${i + 1}장 · ${['한눈에 보는 나', '결과지 전체 구성', '상담 안내'][i]}${i === 1 ? '<span>상담에서 공개</span>' : ''}</p><div class="ap-fluid">${p}</div>`).join('')}</div>`
            : `<div class="card"><p style="margin:0;font-size:14px;color:#64748B">${S.resultErr ? esc(S.resultErr) : '결과지를 불러오는 중…'}</p></div>`}
          ${inv.test ? `<a class="btn light" href="admin.html#/r/${encodeURIComponent(id)}" style="text-align:center;text-decoration:none">테스트 계정 · 전체 결과지 보기</a>
            <p class="fine" style="margin-top:8px">고객용 결과지 3장 전부와 상담사용 자료가 열려요 · 관리자 비밀번호 필요</p>
            <button class="btn ghost" data-act="retest">테스트 계정 · 처음부터 다시 해보기</button>` : ''}
          </section>
          ${S.pages ? `<section class="dn-sec dn-cf" id="sec-cf"><div class="dn-head"><span class="dn-k">STEP 2</span><h2 class="dn-h">1:1 컨설팅 예약 신청</h2><p class="dn-s">결과 상담에서 한 걸음 더 — 진로 방향, 취업 전략, 멘탈 코칭까지 담당 컨설턴트와 함께 계획을 세우고 싶다면 작성해 주세요. 검토 후 연락드려요.</p></div>
            <div class="cf-card" id="cf">${consultHTML()}</div>${fine}</section>` : fine}
        </div></main>`;
        fitPages();
        watchNav();
        return;
      }
      // questions
      const idx = PAGES[S.page], start = Q.PAGE_START[S.page], stressPage = S.page === Q.STRESS_PAGE;
      const answered = S.answers.filter((a) => a !== null).length;
      const complete = idx.every((i) => S.answers[i] !== null);
      const last = S.page === PAGE_COUNT - 1;
      app.innerHTML = `<main>
        <div class="top"><div class="row"><span><span class="part">${stressPage ? '요즘의 나' : '평소의 나'}</span>${S.page + 1} / ${PAGE_COUNT}</span><span>${answered} / ${Q.TOTAL}</span></div>
        <div class="bar"><i style="width:${Math.round(answered / Q.TOTAL * 100)}%"></i></div></div>
        <div class="qs">${inv.test ? '<div class="tfills"><button type="button" class="tfill" data-act="autofill">테스트 계정 · 이 페이지 자동 응답</button><button type="button" class="tfill" data-act="fillall">테스트 계정 · 한 번에 끝까지 (자동 응답 후 제출)</button></div>' : ''}${stressPage ? `<p class="qnote">마지막 ${idx.length}문항이에요. <b>요즘 힘들 때의 나</b>를 떠올리며 답해 주세요.</p>` : ''}${idx.map((i, k) => `<fieldset><legend><span class="no">${start + k + 1}</span>${esc(Q.questionText(i))}</legend>
          <div class="lk">${LIKERT.map(([v, l]) => `<button type="button" data-q="${i}" data-v="${v}" aria-pressed="${S.answers[i] === v}">${l.split('\n').map((x) => `<span>${x}</span>`).join('')}</button>`).join('')}</div></fieldset>`).join('')}
          ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}</div>
        <div class="nav"><div class="row">${S.page > 0 ? '<button class="prev" data-act="prev">이전</button>' : ''}<button class="next" data-act="next" ${!complete || S.busy ? 'disabled' : ''}>${S.busy ? '제출 중…' : last ? '제출하기' : '다음'}</button></div></div>
      </main>`;
    }

    async function submit() {
      const firstEmpty = PAGES.findIndex((pg) => pg.some((i) => S.answers[i] === null));
      if (firstEmpty >= 0) { S.page = firstEmpty; S.err = '아직 응답하지 않은 문항이 있어 그 페이지로 이동했어요.'; draw(); return; }
      S.busy = true; S.err = ''; draw();
      try {
        const j = await api('submit', {
          id, clientName: S.name.trim(), status: S.status, interest: S.interest.trim(), researchConsent: S.research,
          answers: S.answers
        });
        clear(); S.already = !!j.already; S.busy = false;
        go('analyzing');
        await Promise.all([loadResult(), new Promise((r) => setTimeout(r, 2400))]);
        go('done');
      } catch (err) {
        // 앞선 제출이 서버에는 들어갔는데 응답만 늦었던 경우 — 제출된 것으로 보고 결과지를 보여준다
        if (err.message === '이미 제출된 검사입니다.') { clear(); S.busy = false; go('analyzing'); await loadResult(); go('done'); return; }
        S.busy = false; S.err = err.message; draw();
      }
    }

    app.oninput = (e) => {
      const t = e.target;
      if (t.dataset.cfi) { S.cf[t.dataset.cfi] = t.value; const er = t.closest('.field').querySelector('.err'); if (er) er.remove(); return; }
      if (t.dataset.cfo) { S.cf[t.dataset.cfo + 'Other'] = t.value; return; }
      if (t.id === 't-name') S.name = t.value;
      if (t.id === 't-int') S.interest = t.value;
      const b = app.querySelector('[data-go="questions"]');
      if (b) b.disabled = !(S.name.trim() && S.status && S.consent);
    };
    app.onchange = (e) => {
      const t = e.target;
      if (t.id === 't-consent') { S.consent = t.checked; draw(); }
      if (t.id === 't-research') S.research = t.checked;
    };
    app.onclick = (e) => {
      if (S.step === 'story') {
        const b = e.target.closest('button');
        if (b && b.dataset.act === 'story-skip') storyEnd();
        else if (b && b.dataset.act === 'story-start') storyEnd('form');
        else if (!b) storyGo(e.clientX < window.innerWidth * 0.28 ? S.slide - 1 : S.slide + 1);
        return;
      }
      const t = e.target.closest('button,[data-go]');
      if (!t) return;
      if (t.dataset.act === 'story-again') { S.slide = 0; go('story'); return; }
      if (t.dataset.act === 'jump') { const el = document.getElementById(t.dataset.to); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      if (t.dataset.act === 'cf-again') { S.cfEdit = true; S.err = ''; S.cerr = {}; drawCf(); return; }
      if (t.dataset.act === 'cf-submit') { cfSubmit(); return; }
      if (t.dataset.cf) { const a = S.cf[t.dataset.cf], v = t.dataset.v; S.cf[t.dataset.cf] = a.includes(v) ? a.filter((x) => x !== v) : a.concat(v); if (S.cerr) delete S.cerr[t.dataset.cf]; drawCf(); return; }
      if (t.dataset.cs) { const k = t.dataset.cs; S.cf[k] = k === 'mbti' && S.cf[k] === t.dataset.v ? '' : t.dataset.v; if (S.cerr) delete S.cerr[k]; drawCf(); return; }
      if (t.dataset.go) { if (t.dataset.go === 'questions') save(); go(t.dataset.go); return; }
      if (t.dataset.status) { S.status = t.dataset.status; draw(); return; }
      if (t.dataset.q) {
        S.answers[+t.dataset.q] = +t.dataset.v; save();
        t.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
        const idx = PAGES[S.page];
        const n = app.querySelector('[data-act="next"]'); if (n) n.disabled = !idx.every((i) => S.answers[i] !== null);
        const answered = S.answers.filter((a) => a !== null).length;
        const top = app.querySelector('.top .row span:last-child'); if (top) top.textContent = `${answered} / ${Q.TOTAL}`;
        const bar = app.querySelector('.bar i'); if (bar) bar.style.width = Math.round(answered / Q.TOTAL * 100) + '%';
        return;
      }
      const act = t.dataset.act;
      if (act === 'more') { e.preventDefault(); S.open = !S.open; draw(); }
      else if (act === 'restart') { clear(); S.answers = Array(Q.TOTAL).fill(null); S.page = 0; S.resumable = 0; go('form'); }
      else if (act === 'autofill') {
        // 테스트 계정만: 지금 페이지의 빈 문항을 무작위로 채운다
        PAGES[S.page].forEach((i) => { if (S.answers[i] === null) S.answers[i] = 1 + Math.floor(Math.random() * 5); });
        save(); draw();
      }
      else if (act === 'fillall') {
        // 테스트 계정만: 남은 문항을 한 유형이 뚜렷한 응답으로 채우고 바로 제출
        const sa = LLP.sampleAnswers(1 + Math.floor(Math.random() * 9));
        S.answers = S.answers.map((v, i) => (v === null ? sa[i] : v));
        S.page = PAGE_COUNT - 1; save(); submit();
      }
      else if (act === 'retest') {
        t.disabled = true; t.textContent = '처음으로 돌리는 중…';
        api('resetTest', { id }).then(() => { clear(); try { sessionStorage.setItem('ll-fresh-' + id, '1'); sessionStorage.removeItem(CF_KEY); sessionStorage.removeItem(CF_KEY + '-form'); } catch (_) { /* 무시 */ } location.reload(); }, (err) => { t.disabled = false; t.textContent = err.message; });
      }
      else if (act === 'part2') { S.page = PART2_PAGE; save(); go('questions'); }
      else if (act === 'prev') { S.page -= 1; S.err = ''; save(); draw(); window.scrollTo(0, 0); }
      else if (act === 'next') {
        if (S.page === PAGE_COUNT - 1) { submit(); return; }
        if (S.page + 1 === PART2_PAGE) { save(); go('break'); return; }
        S.page += 1; S.err = ''; save(); draw(); window.scrollTo(0, 0);
      }
    };
    draw();
    if (S.step === 'done') loadResult().then(draw);
  }

})();
</script>
</body>
</html>
