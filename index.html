<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13203F">
<title>20대 핵심역량 진단 — LOGIN LAB 연구소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#13203F;--accent:#2F6BFF;--soft:#DCE7FF;--tint:#EAF0FF;--line:#D6DCE6;--sub:#5B6478;--faint:#8E96A8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:16px}
button,input{font:inherit;color:inherit}
.dark{min-height:100vh;min-height:100dvh;background:var(--ink);color:#fff;padding:48px 24px}
.dark.center{display:flex;align-items:center}
.wrap{max-width:512px;margin:0 auto;width:100%}
.org{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--soft)}
h1{margin:0}
.h-xl{font-size:34px;font-weight:900;line-height:1.2;letter-spacing:-.02em;margin-top:20px}
.h-lg{font-size:30px;font-weight:900;line-height:1.25;letter-spacing:-.02em;margin-top:24px}
.h-md{font-size:28px;font-weight:900;line-height:1.3;margin-top:12px}
.lead{margin-top:14px;font-size:15px;line-height:1.65;color:rgba(255,255,255,.75)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:32px;text-align:center}
.stats div{background:rgba(255,255,255,.07);border-radius:16px;padding:16px 6px}
.stats b{display:block;font-size:24px;font-weight:900;color:var(--soft)}
.stats span{display:block;margin-top:4px;font-size:12px;color:rgba(255,255,255,.6)}
.card{margin-top:24px;background:#fff;color:#334155;border-radius:16px;padding:24px}
.card h2{margin:0;font-size:18px;font-weight:900;color:var(--ink)}
.card ol{margin:12px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.65}
.card li+li{margin-top:10px}
.card li b.n{color:var(--accent)}
.meet{margin-top:16px;border-radius:12px;padding:12px 16px;font-size:14px;background:var(--tint);color:var(--ink)}
.meet b{color:var(--accent);margin-right:8px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;min-height:52px}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.3;cursor:default}
.btn.light{background:var(--soft);color:var(--ink);margin-top:24px}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);margin-top:12px;font-size:14px;padding:14px}
.btn.ink{background:var(--ink);color:#fff;margin-top:32px}
.fine{margin-top:24px;text-align:center;font-size:12px;line-height:1.6;color:rgba(255,255,255,.45)}
.by{margin-top:10px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.35)}
.trust{margin-top:16px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.04);padding:20px}
.trust h2{margin:0;font-size:16px;font-weight:800;color:#fff}
.trust ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.trust li{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.72)}
.trust li b{display:block;margin-bottom:2px;font-size:12px;font-weight:800;color:var(--soft)}
.trust p{margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:700;color:rgba(255,255,255,.55)}
.anl ol{margin:28px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.anl li{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:rgba(255,255,255,.3);animation:anl-on .35s forwards;animation-delay:var(--d)}
.anl li i{position:relative;flex:0 0 22px;width:22px;height:22px;border:2px solid rgba(255,255,255,.2);border-radius:50%;animation:anl-dot .35s forwards;animation-delay:var(--d)}
.anl li i::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);opacity:0;animation:anl-ck .35s forwards;animation-delay:var(--d)}
@keyframes anl-on{to{color:#fff}}
@keyframes anl-dot{to{background:var(--accent);border-color:var(--accent)}}
@keyframes anl-ck{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.anl li,.anl li i,.anl li i::after{animation-duration:0s;animation-delay:0s}}
.form{margin-top:32px}
.field+.field{margin-top:20px}
.lbl{display:block;font-size:14px;font-weight:700;color:#334155}
.lbl small{font-weight:400;color:#94A3B8;font-size:14px}
.inp{margin-top:8px;width:100%;border:1px solid #CBD5E1;border-radius:12px;padding:12px 16px;font-size:16px;outline:none;background:#fff;color:var(--ink)}
.inp:focus{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid #CBD5E1;background:#fff;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;color:#64748B;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:transparent;color:#fff}
.agree{margin-top:20px;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:12px;padding:16px;display:grid;gap:12px}
.agree label{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.6;color:#475569;cursor:pointer}
.agree input{margin-top:4px;width:16px;height:16px;flex:0 0 16px;accent-color:#13203F}
.agree b{color:#1E293B}
.agree .more{border:0;background:none;padding:0;margin-left:6px;font-size:12px;color:#64748B;text-decoration:underline;cursor:pointer}
.agree .note{display:block;font-size:12px;color:#94A3B8;margin-top:2px}
.detail{background:#fff;border-radius:8px;padding:12px;font-size:12px;line-height:1.6;color:#64748B;box-shadow:0 0 0 1px #F1F5F9}
.detail p{margin:0}.detail p+p{margin-top:6px}.detail b{color:#475569}
.err{margin-top:16px;border-radius:12px;background:#FEF2F2;color:#DC2626;padding:12px 16px;font-size:14px}
.light-page{min-height:100vh;background:#fff;padding:40px 24px}
.light-page h1{font-size:24px;font-weight:900;color:var(--ink)}
.light-page .desc{margin-top:8px;font-size:14px;color:#64748B}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid #E2E8F0;padding:12px 24px}
.top .row{max-width:512px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#64748B}
.top .part{background:var(--tint);color:var(--accent);border-radius:999px;padding:2px 8px;font-size:11px;margin-right:8px}
.bar{max-width:512px;margin:8px auto 0;height:6px;border-radius:9px;background:#F1F5F9;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent);transition:width .2s}
.qs{max-width:512px;margin:0 auto;padding:32px 24px 140px}
fieldset{border:0;margin:0;padding:0}
fieldset+fieldset{margin-top:32px}
legend{padding:0;font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
legend .no{color:#CBD5E1;margin-right:8px}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.tfills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin:0 0 24px}
.tfills .tfill{margin:0}
.pv{margin-top:24px}
.pv-t{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;font-weight:800;color:#fff}
.pv-t span{border-radius:999px;background:#F2862E;padding:2px 8px;font-size:11px;color:#fff}
.pv-crop{position:relative;overflow:hidden;border-radius:14px;aspect-ratio:540/600}
.pv-crop::after{content:'';position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(rgba(19,32,63,0),var(--ink))}
.pv-s{margin:10px 0 0;font-size:13px;line-height:1.6;color:rgba(255,255,255,.7)}
.tfill{display:block;margin:0 0 24px auto;border:1px dashed #CBD5E1;border-radius:999px;background:#F8FAFC;padding:6px 14px;font-size:12px;font-weight:700;color:#64748B;cursor:pointer}
.lk button{border:1px solid #E2E8F0;background:#fff;border-radius:12px;padding:12px 0;font-size:11px;font-weight:700;line-height:1.25;color:#64748B;cursor:pointer;min-height:48px}
.lk button span{display:block}
.lk button[aria-pressed="true"]{background:var(--ink);border-color:transparent;color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E2E8F0;padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px))}
.nav .row{max-width:512px;margin:0 auto;display:flex;gap:12px}
.nav button{border-radius:12px;padding:14px 24px;font-size:14px;font-weight:700;cursor:pointer;min-height:48px}
.nav .prev{border:1px solid #CBD5E1;background:#fff;color:#475569}
.nav .next{flex:1;border:0;background:var(--ink);color:#fff}
.nav .next:disabled{opacity:.3;cursor:default}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:rgba(255,255,255,.7);font-size:14px}
.white-card{margin-top:32px;background:#fff;color:var(--ink);border-radius:16px;padding:24px}
.white-card .lbl{color:var(--ink)}
</style>
<!-- 결과지 스타일 (자동 생성 — 직접 고치지 마세요) -->
<style>
.rp-page{width:540px;height:960px;position:relative;overflow:hidden;background:#F3F5FA;color:#1A2233;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;letter-spacing:-0.2px;-webkit-font-smoothing:antialiased;line-height:normal;font-size:14px;text-align:left}

.rp-page b{font-weight:800}
.rp-pad{padding:0 28px}

.rp-eyebrow{font-size:12px;font-weight:800;color:#2F6BFF;letter-spacing:1.5px}
.rp-h2{font-size:24px;font-weight:800;line-height:1.35;margin-top:6px;color:#1A2233}
.rp-card{background:#FFFFFF;border-radius:18px;box-shadow:0 1px 0 rgba(19,32,63,.04),0 6px 20px rgba(19,32,63,.06)}

.rp-inst i{width:22px;height:22px;border-radius:6px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;color:#13203F;font-style:normal;font-size:12px;font-weight:900}
.rp-tag{display:inline-block;margin-top:26px;font-size:12px;font-weight:700;padding:5px 10px;border:1px solid rgba(255,255,255,.35);border-radius:999px;opacity:.9}
.rp-hero h1{font-size:32px;line-height:1.3;font-weight:900;margin-top:12px;letter-spacing:-0.8px}

.rp-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:22px;font-size:12.5px}

.rp-method{margin:-28px 20px 0;padding:22px 22px 8px;position:relative}

.rp-lead{font-size:12.5px;color:#5B6478;margin-top:4px;line-height:1.5}
.rp-step{display:flex;gap:12px;padding:12px 0;border-top:1px solid #E3E7EF}
.rp-step.first{border-top:none}
.rp-step .n{flex:0 0 26px;height:26px;border-radius:8px;background:#EEF3FF;color:#2F6BFF;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.rp-step .t{font-size:14px;font-weight:800}
.rp-step .d{font-size:12.3px;color:#5B6478;line-height:1.5;margin-top:2px}
.rp-rel{margin:14px 20px 0;padding:14px 18px;display:flex;align-items:center;gap:12px}

.rp-rel .d{font-size:12px;color:#5B6478;margin-top:1px}
.rp-research{margin:14px 22px 0;font-size:11.2px;line-height:1.6;color:#7A8398;display:flex;gap:8px}
.rp-research svg{flex:0 0 14px;margin-top:3px}
.rp-top{padding-top:34px}
.rp-type{margin:18px 20px 0;padding:22px;background:linear-gradient(150deg,#1E3264,#2F6BFF);color:#FFFFFF;border-radius:18px}
.rp-type .l{font-size:12px;font-weight:700;opacity:.8}
.rp-type .nm{font-size:25px;font-weight:900;line-height:1.3;margin-top:6px;letter-spacing:-0.6px}
.rp-type .ds{font-size:12.8px;line-height:1.55;margin-top:10px;opacity:.92}
.rp-scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 20px 0}
.rp-scores .rp-card{padding:14px 16px}
.rp-scores .l{font-size:11.5px;color:#5B6478;font-weight:700}
.rp-scores .v{font-size:30px;font-weight:900;margin-top:2px;letter-spacing:-1px}
.rp-scores .v small{font-size:14px;color:#9AA3B5;font-weight:700;margin-left:2px}
.rp-scores .s{font-size:11px;color:#5B6478;margin-top:2px}
.rp-bar{height:6px;border-radius:9px;background:#E8ECF4;margin-top:8px;position:relative;overflow:hidden}
.rp-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.rp-radar{margin:12px 20px 0;padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center}
.rp-legend{display:flex;gap:16px;font-size:11.5px;color:#5B6478;font-weight:700;margin-top:2px}
.rp-legend span{display:flex;align-items:center;gap:6px}
.rp-dgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;width:100%;margin-top:10px}
.rp-dchip{border-radius:12px;background:#F6F8FC;padding:9px 6px;text-align:center}
.rp-dchip .n{font-size:11px;font-weight:800;color:#5B6478}
.rp-dchip .v{font-size:20px;font-weight:900;margin-top:1px}
.rp-dchip .g{font-size:10.5px;font-weight:800;margin-top:1px}
.rp-subs{margin:16px 20px 0;padding:14px 18px 10px}
.rp-grp{padding:7px 0 6px;border-top:1px solid #E3E7EF}
.rp-grp.first{border-top:none}
.rp-grp .gh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;margin-bottom:4px}
.rp-grp .gh i{width:8px;height:8px;border-radius:2px;display:inline-block}
.rp-row{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:10px;height:25px}
.rp-row .nm{font-size:12.3px;color:#3A4357;white-space:nowrap}
.rp-row .tr{height:9px;border-radius:9px;background:#EDF0F6;position:relative;overflow:hidden}
.rp-row .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.rp-row .sc{font-size:13px;font-weight:800;text-align:right;white-space:nowrap}
.rp-bdg{font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:5px;margin-left:4px;vertical-align:1px}
.rp-good{background:#E3F6EF;color:#0E8A6A}
.rp-warnb{background:#FFEDDF;color:#D06A16}
.rp-interp{margin:12px 20px 0;padding:16px 18px}
.rp-interp h3{font-size:14.5px;font-weight:800}
.rp-it{display:flex;gap:10px;margin-top:11px}
.rp-it .k{flex:0 0 44px;font-size:11px;font-weight:800;padding:3px 0;border-radius:6px;text-align:center;height:22px}
.rp-it .x{font-size:12.6px;line-height:1.55;color:#2E3648}
.rp-pattern{margin:12px 20px 0;padding:15px 18px;border-radius:16px;background:#FFF7EC;border:1px dashed #F2B577}
.rp-pattern .l{font-size:11.5px;font-weight:800;color:#C2620F}
.rp-pattern .t{font-size:16px;font-weight:900;margin-top:3px}
.rp-pattern .x{font-size:12.6px;line-height:1.55;color:#4A3A28;margin-top:5px}
.rp-sub{font-size:12.8px;line-height:1.55;margin-top:8px;color:#5B6478}

.rp-lock .t{font-size:14.2px;font-weight:800}
.rp-lock .s{font-size:11.5px;color:#5B6478;margin-top:1px}
.rp-redact{display:flex;gap:6px;margin-top:7px}
.rp-lock.tight{margin-top:7px;padding:9px 16px}.rp-lock.tight .rp-redact{margin-top:5px}
.rp-redact i{height:9px;border-radius:5px;background:#E3E8F1;display:block}
.rp-meet{margin:14px 20px 0;padding:16px 18px;border-radius:16px;background:#13203F;color:#FFFFFF}

.rp-meet .g b{font-weight:700}

.rp-thanks{margin:12px 20px 0;padding:13px 18px;border-radius:16px;background:#EAF0FF}

.rp-thanks .x{font-size:11.8px;line-height:1.6;color:#3A4A70;margin-top:3px}
.rp-ev{color:#6C4CF1}
.rp-vio{background:#EFEAFF;color:#5B3FD9}.rp-vio2{background:#F4F1FF;color:#7B66D9}.rp-tealb{background:#E2F4F7;color:#11788C}.rp-amb{background:#FFF1DC;color:#B4620E}

.rp-itype .nm{font-size:25px;font-weight:900;line-height:1.3;margin-top:5px;letter-spacing:-0.6px}

.rp-irow .sc{font-size:13.5px;font-weight:800;text-align:right;white-space:nowrap}

.rp-ilist{margin:14px 20px 0;padding:15px 18px}

.rp-ilist .li svg{flex:0 0 14px;margin-top:3px}

    ];

    const meet = M ? `<div class="rp-meet"><div class="l">상담 일정</div><div class="d">${M.mid}${M.time ? " " + M.time : ""}</div><div class="g">${mt.place ? `<span>장소</span><b>${esc2(mt.place)}</b>` : ""}${mt.counselor ? `<span>담당</span><b>${esc2(mt.counselor)} 연구원</b>` : ""}<span>소요</span><b>${esc2(SITE.duration)}</b></div></div>` : `<div class="rp-meet none"><div class="l">상담 일정</div><div class="d">담당 연구원이 연락드려<br>편한 일정으로 정할게요</div></div>`;
    const thanks = input.research === false ? `<div class="rp-thanks"><div class="t">진단에 참여해 주셔서 감사합니다</div><div class="x">${name} 님의 응답은 결과지와 1:1 상담에만 쓰이고, 상담이 끝나면 안전하게 보관·파기됩니다.</div></div>` : `<div class="rp-thanks"><div class="t">연구 참여에 감사드립니다</div><div class="x">${name} 님의 응답은 이름·연락처를 제거한 뒤 「20대 핵심역량」 연구 데이터로 함께 쌓여, 같은 고민을 하는 20대를 위한 논문과 연구 보고서로 이어집니다.</div></div>`;
    return `<section class="rp-page"><div class="rp-pad rp-top"><div class="rp-eyebrow">NEXT · 1:1 결과 해석 상담</div><div class="rp-h2">점수 뒤에 숨은 이야기는<br>상담에서 함께 볼게요</div>
  <div class="rp-sub">리포트에는 담지 못한 문항별 응답 분석 결과를<br>연구원이 직접 풀어서 설명해 드려요.</div></div>
  ${locks.map((l) => lockCard(l[0], l[1], l[2])).join("")}
  ${meet}
  ${thanks}
  <div class="rp-fine">본 진단은 자기보고식 성향 검사로, 역량은 성향에서 풀어낸 경향을 보여주는 참고 자료입니다.<br>문의·일정 변경 ${esc2(SITE.contact)}</div>
  ${foot2(3)}</section>`;
  }
  function veiledPage2(D) {
    const fake = [72, 54, 38, 64, 48, 80, 58];
    const rows = ["실행의 힘", "관계의 힘", "생각의 힘", ...DOMAINS.map((d) => d[1])].map((n, i) => `${i === 3 ? '<div class="rp-grp"><div class="gh"><i style="background:#2F6BFF"></i>4개 영역 역량 경향</div>' : i === 0 ? '<div class="rp-grp first"><div class="gh"><i style="background:#6C4CF1"></i>에너지 중심</div>' : ""}<div class="rp-row"><div class="nm">${esc2(n)}</div><div class="tr"><i style="width:${fake[i]}%;background:#C3CCDD"></i></div><div class="sc">··</div></div>${i === 2 || i === 6 ? "</div>" : ""}`).join("");
    return `<section class="rp-page"><div class="rp-pad rp-top"><div class="rp-eyebrow">RESULT · 내면 동력으로 본 역량</div><div class="rp-h2">강점이 되기 쉬운 역량과<br>보완하면 좋은 역량</div>
  <div class="rp-sub">에너지 중심과 역량별 해석은<br>1:1 상담에서 연구원이 결과지와 함께 열어 드려요.</div></div>
  <div class="rp-card rp-subs rp-subs-tight rpx-veil"><div class="rpx-blur">${rows}</div><div class="rpx-pill">${lockSvg("#13203F")}상담에서 공개돼요</div></div>
  ${lockCard("연구진 해석", "강점과 보완점, 내면 동력을 함께 읽은 해석", [38, 30, 22])}
  ${lockCard(`눈여겨볼 패턴 ‘${D.drive.comp}의 그림자’`, "내 힘이 지나칠 때 나타나는 모습", [42, 34])}
  ${foot2(2)}</section>`;
  }
  function participantPages(input) {
    const D = scoreDrive(input.answers);
    if (!D) return null;
    return [page1(input, D), veiledPage2(D), page3(input, D)];
  }
  return __toCommonJS(participant_entry_exports);

<script>
(function () {
  'use strict';
  const Q = LLQ;
  const PER_PAGE = Q.PER_PAGE;                               // 9
  const PAGE_COUNT = Math.ceil(Q.TOTAL / PER_PAGE);         // 9
  const PART2_PAGE = Q.BREAK_PAGE;                          // 이 페이지 앞에서 ‘절반 왔어요’ 화면
  const DRAFT_TTL = 1000 * 60 * 60 * 24 * 7;
  const LIKERT = [[1, '전혀\n아니다'], [2, '아니다'], [3, '보통'], [4, '그렇다'], [5, '매우\n그렇다']];
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const configured = !/여기에/.test(API_URL);

  // 구글 서버는 가끔 응답 없이 멈출 때가 있어 25초가 지나면 끊는다. 제출이 아닌 요청은 한 번 더 보낸다.
  async function call(action, data) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 25000);
    let j;
    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action }, data || {})), signal: ctl.signal });
      j = await res.json().catch(() => ({}));
    } catch (_) {
      const err = new Error(ctl.signal.aborted ? '서버 응답이 늦어요. 잠시 후 다시 시도해 주세요.' : '인터넷 연결을 확인하고 다시 시도해 주세요.');
      err.retry = true;
      throw err;
    } finally { clearTimeout(timer); }
    if (!j.ok) throw new Error(j.error || '요청을 처리하지 못했어요.');
    return j;
  }
  async function api(action, data) {
    if (!configured) throw new Error('index.html 맨 위의 API_URL 을 아직 넣지 않았어요.');
    try { return await call(action, data); }
    catch (err) { if (err.retry && action !== 'submit') return call(action, data); throw err; }
  }
  function meetText(m) {
    if (!m || !m.date) return '';
    const [y, mo, d] = m.date.split('-').map(Number);
    const wd = '일월화수목금토'[new Date(y, mo - 1, d).getDay()];
    let t = '';
    if (m.time) { const [h, mi] = m.time.split(':').map(Number); t = ` ${h < 12 ? '오전' : '오후'} ${((h + 11) % 12) + 1}:${String(mi).padStart(2, '0')}`; }
    return `${mo}월 ${d}일 (${wd})${t}${m.place ? ' · ' + m.place : ''}`;
  }

  // 구글 서버는 한동안 쉬다가 받은 첫 요청이 느리다 — 화면이 열리자마자 미리 깨워 둔다 (응답은 쓰지 않는다)
  if (configured) fetch(API_URL, { mode: 'no-cors' }).catch(() => {});
  const id = new URLSearchParams(location.search).get('id');
  if (id) startTest(id); else renderEntry();

  /* ─── 첫 화면 (로그인 웹) ─────────────────────────────── */
  function renderEntry() {
    // 응시자와 관리자가 같은 칸을 쓴다: 이름에 '관리자'를 넣으면 연락처 칸에 넣은 값이 관리자 비밀번호가 된다
    const st = { name: '', phone: '', busy: false, err: '' };
    const isAdmin = () => st.name.trim() === SITE.adminName;
    const isTest = () => st.name.trim() === SITE.testName && st.phone.replace(/\D/g, '') === SITE.testPhone;
    const ready = () => (isAdmin() ? st.phone.trim().length > 0 : isTest() || (st.name.trim() && st.phone.replace(/\D/g, '').length >= 8));
    const draw = () => {
      app.innerHTML = `<main class="dark center"><div class="wrap">
        <p class="org">${esc(SITE.org)}</p>
        <h1 class="h-xl">20대<br>핵심역량 진단</h1>
        <p class="lead">안내받은 이름과 연락처를 입력하면 검사를 시작할 수 있어요.</p>
        <form class="white-card" id="f" novalidate>
          <div class="field"><label class="lbl" for="e-name">이름</label><input class="inp" id="e-name" maxlength="40" autocomplete="name" placeholder="홍길동" value="${esc(st.name)}"></div>
          <div class="field"><label class="lbl" for="e-phone">연락처</label><input class="inp" id="e-phone" maxlength="30" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" value="${esc(st.phone)}"></div>
          ${st.err ? `<p class="err" role="alert">${esc(st.err)}</p>` : ''}
          <button class="btn ink" type="submit" style="margin-top:20px" ${!ready() || st.busy ? 'disabled' : ''}>${st.busy ? '확인 중…' : '검사 시작하기'}</button>
        </form>
        <p class="fine">담당 연구원에게 받은 링크로 바로 들어와도 돼요.</p>
        <p class="by">${esc(SITE.org)} × ${esc(SITE.partner)} 공동 개발</p>
        ${configured ? '' : '<p class="err">설정 필요: index.html 맨 위의 API_URL 에 구글 Apps Script 웹 앱 주소를 넣어 주세요.</p>'}
      </div></main>`;
    };
    draw();
    app.oninput = (e) => {
      const t = e.target;
      if (t.id === 'e-name') st.name = t.value;
      if (t.id === 'e-phone') st.phone = t.value;
      st.err = '';
      app.querySelector('button[type=submit]').disabled = !ready();
      const er = app.querySelector('.err[role=alert]'); if (er) er.remove();
    };
    app.onsubmit = async (e) => {
      e.preventDefault();
      if (!ready()) return;
      st.busy = true; st.err = ''; draw();
      try {
        if (isAdmin()) {
          const j = await api('login', { password: st.phone.trim(), withList: true });
          // 관리자 화면은 이 비밀번호로 잠금을 풀고, 서버 요청에는 토큰을 쓴다. 함께 받은 명단은 관리자 화면이 바로 보여준다.
          try {
            sessionStorage.setItem('ll_token', j.token); sessionStorage.setItem('ll_pw', st.phone.trim());
            if (Array.isArray(j.rows)) sessionStorage.setItem('ll_rows', JSON.stringify({ at: Date.now(), rows: j.rows, login: true }));
          } catch (_) { /* 저장소를 못 쓰면 관리자 화면에서 다시 입력 */ }
          location.href = 'admin.html';
          return;
        }
        const j = await api('find', { name: st.name.trim(), phone: st.phone });
        location.href = '?id=' + encodeURIComponent(j.id);
      } catch (err) {
        st.busy = false; st.err = err.message; draw();
      }
    };
  }

  /* ─── 검사 ───────────────────────────────────────────── */
  async function startTest(id) {
    let inv;
    try { inv = await api('invite', { id }); }
    catch (err) {
      app.innerHTML = `<main class="dark center"><div class="wrap"><p class="org">${esc(SITE.org)}</p><h1 class="h-md">검사 링크를 열 수 없어요</h1><p class="lead">${esc(err.message)}</p><a class="btn light" href="./" style="text-align:center;text-decoration:none">첫 화면으로</a></div></main>`;
      return;
    }
    const KEY = 'll-draft-' + id;
    const S = {
      step: inv.done ? 'done' : 'intro', name: inv.name, status: '', interest: '', consent: false, research: false, open: false,
      answers: Array(Q.TOTAL).fill(null), page: 0, busy: false, err: '', resumable: 0, already: inv.done
    };
    const meeting = meetText(inv.meeting);
    if (!inv.done) {
      try {
        const d = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (d && Array.isArray(d.answers) && d.answers.length === Q.TOTAL && Date.now() - d.savedAt < DRAFT_TTL) {
          const n = d.answers.filter((a) => a !== null).length;
          if (n) { S.answers = d.answers; S.page = Math.min(Math.max(d.page || 0, 0), PAGE_COUNT - 1); S.status = d.status || ''; S.interest = d.interest || ''; S.resumable = n; }
        }
      } catch (_) { /* 저장소를 못 쓰는 브라우저 */ }
    }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ savedAt: Date.now(), answers: S.answers, page: S.page, status: S.status, interest: S.interest })); } catch (_) { /* 무시 */ } };
    const clear = () => { try { localStorage.removeItem(KEY); } catch (_) { /* 무시 */ } };
    const go = (step) => { S.step = step; S.err = ''; draw(); window.scrollTo(0, 0); };

    // 제출 뒤 결과지: 1장은 그대로, 2장은 가린 채로, 3장(상담 안내)은 그대로 보여준다
    async function loadResult() {
      try { S.pages = LLP.participantPages(await api('result', { id })); S.resultErr = S.pages ? '' : '결과지를 만들지 못했어요.'; }
      catch (err) { S.pages = null; S.resultErr = err.message; }
    }
    // 결과지 한 장(540×960)을 화면 너비에 맞춰 줄인다
    const fitPages = () => app.querySelectorAll('.ptc-fit').forEach((el) => {
      const s = el.clientWidth / 540;
      el.style.height = Math.round(960 * s) + 'px';
      el.firstElementChild.style.transform = `scale(${s})`;
    });
    window.addEventListener('resize', fitPages);

    // 시작 전에 ‘이런 결과지를 받아요’ — 내 이름으로 만든 1장 예시 (응답은 예시 값)
    function previewHTML() {
      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      const p = LLP.participantPages({ name: S.name || inv.name, reportNo: 'LL-예시', testDate: today, status: '대학생', research: true, meeting: {}, answers: LLP.sampleAnswers(2) });
      return p ? `<div class="pv"><p class="pv-t">검사가 끝나면 이런 결과지를 바로 받아요 <span>예시</span></p><div class="pv-crop"><div class="ptc-fit"><div>${p[0]}</div></div></div><p class="pv-s">내 응답으로 만든 1장 ‘한눈에 보기’가 검사 직후 열리고, 자세한 해석과 직무 추천은 1:1 상담에서 함께 봐요.</p></div>` : '';
    }

    function draw() {
      if (S.step === 'intro') {
        app.innerHTML = `<main class="dark"><div class="wrap">
          <p class="org">${esc(SITE.org)}</p>
          <h1 class="h-lg">${esc(S.name)} 님,<br>핵심역량 진단에<br>초대합니다</h1>
          <p class="lead">${esc(SITE.tagline)}</p>
          <div class="stats"><div><b>${Q.TOTAL}</b><span>문항</span></div><div><b>${SITE.minutes}분</b><span>소요 시간</span></div><div><b>1:1</b><span>결과 상담</span></div></div>
          <div class="card"><h2>이렇게 진행돼요</h2><ol>
            <li><b class="n">1.</b> 문장을 읽고 지금의 나에 가까운 정도를 고르면 돼요. 정답은 없어요.</li>
            <li><b class="n">2.</b> 제출하면 결과지 1장 ‘한눈에 보기’를 바로 볼 수 있어요. 자세한 해석은 <b>상담에서 연구원이 결과지와 함께 직접 설명</b>해 드려요.</li></ol>
            ${meeting ? `<div class="meet"><b>상담 일정</b>${esc(meeting)}</div>` : ''}</div>
          ${previewHTML()}
          <div class="trust"><h2>이 진단은 이렇게 만들었어요</h2><ul>
            <li><b>내면 동력</b>${Q.TOTAL}문항으로 9가지 성향 중 나를 움직이는 힘을 찾아요. 같은 일도 무엇이 나를 움직이는지에 따라 맞는 성장 방법이 달라요.</li>
            <li><b>역량으로 풀어 보기</b>그 성향이 AI·기술 활용, 사고·문제 해결, 적응·자기관리, 관계·리더십 중 어디서 강점이 되는지 세계경제포럼(WEF) 「Future of Jobs 2025」의 역량 분류로 풀어요.</li>
            <li><b>응답 신뢰도</b>같은 번호만 길게 이어 고르는 등 응답이 한쪽으로 쏠리면 결과지에 표시하고, 상담에서 다시 확인해요.</li></ul>
            <p>${esc(SITE.org)} × ${esc(SITE.partner)} 공동 개발</p></div>
          ${S.resumable ? `<button class="btn light" data-go="form">이어서 하기 · ${S.resumable}/${Q.TOTAL} 응답함</button><button class="btn ghost" data-act="restart">처음부터 다시 하기</button>`
            : `<button class="btn light" data-go="form">시작하기</button>`}
          ${inv.test ? '<p class="fine" style="color:var(--soft)">테스트 계정이에요. 결과를 본 뒤 언제든 처음부터 다시 해볼 수 있고, 응답은 연구 통계에 쓰이지 않아요.</p>' : ''}
          <p class="fine">응답은 안전하게 보관하며, 연구 활용에 동의한 경우에만<br>이름·연락처를 지운 뒤 통계로 분석합니다.</p>
        </div></main>`;
        fitPages();
        return;
      }
      if (S.step === 'form') {
        const ok = S.name.trim() && S.status && S.consent;
        app.innerHTML = `<main class="light-page"><div class="wrap">
          <h1>간단한 정보</h1><p class="desc">결과지에 들어갈 정보예요. 1분이면 끝나요.</p>
          <div class="form">
            <div class="field"><label class="lbl" for="t-name">이름</label><input class="inp" id="t-name" maxlength="40" autocomplete="name" value="${esc(S.name)}"></div>
            <div class="field"><p class="lbl" style="margin:0">현재 상황</p><div class="chips">${Q.STATUS_OPTIONS.map((o) => `<button type="button" class="chip" data-status="${esc(o)}" aria-pressed="${S.status === o}">${esc(o)}</button>`).join('')}</div></div>
            <div class="field"><label class="lbl" for="t-int">관심 있는 직무·분야 <small>(선택)</small></label><input class="inp" id="t-int" maxlength="40" placeholder="예: 마케팅, 서비스 기획, 아직 모르겠음" value="${esc(S.interest)}"></div>
            <div class="agree">
              <label><input type="checkbox" id="t-consent" ${S.consent ? 'checked' : ''}><span><b>[필수]</b> 개인정보 수집·이용에 동의합니다.<button type="button" class="more" data-act="more">${S.open ? '접기' : '자세히'}</button></span></label>
              ${S.open ? `<div class="detail"><p><b>수집 항목</b> · 이름, 연락처, 현재 상황, 관심 직무, 검사 응답</p><p><b>이용 목적</b> · ${esc(SITE.org)} 결과지 제공, 1:1 결과 상담 일정 안내</p><p><b>보유·이용 기간</b> · ${esc(SITE.retention)}</p><p style="color:#94A3B8">동의를 거부할 수 있으나, 결과지 제공에 꼭 필요한 정보라 거부 시 진단이 제한됩니다.</p></div>` : ''}
              <label><input type="checkbox" id="t-research" ${S.research ? 'checked' : ''}><span><b>[선택]</b> 이름·연락처를 지운 응답을 20대 역량 연구(통계·논문)에 활용하는 데 동의합니다.<span class="note">동의하지 않아도 진단과 상담은 똑같이 받을 수 있어요.</span></span></label>
            </div>
          </div>
          <button class="btn ink" data-go="questions" ${ok ? '' : 'disabled'}>${S.resumable ? `이어서 하기 (${S.page + 1}/${PAGE_COUNT} 페이지)` : '검사 시작'}</button>
        </div></main>`;
        return;
      }
      if (S.step === 'break') {
        app.innerHTML = `<main class="dark center"><div class="wrap">
          <p class="org" style="letter-spacing:0;font-size:14px">절반 왔어요 · ${PART2_PAGE * PER_PAGE}문항</p>
          <h1 class="h-md">잘하고 있어요!<br>남은 건 ${Q.TOTAL - PART2_PAGE * PER_PAGE}문항이에요</h1>
          <p class="lead">깊이 고민하기보다 <b style="color:#fff">먼저 떠오르는 쪽</b>을 고르면 돼요. 정답은 없어요.</p>
          <button class="btn light" data-act="part2" style="margin-top:40px">이어서 하기</button>
        </div></main>`;
        return;
      }
      if (S.step === 'analyzing') {
        // 제출 직후 잠깐: 실제로 거치는 계산 단계를 차례로 보여준다
        const steps = [`${Q.TOTAL}문항으로 9가지 내면 동력 점수 계산`, '행동·감정·사고 중 에너지 중심 찾기', '응답 패턴으로 신뢰도 확인', '결과지 1장 ‘한눈에 보기’ 만들기'];
        app.innerHTML = `<main class="dark center"><div class="wrap anl" role="status" aria-live="polite">
          <p class="org" style="letter-spacing:0;font-size:14px">제출 완료</p>
          <h1 class="h-md">${esc(S.name.trim() || inv.name)} 님의<br>결과지를 만들고 있어요</h1>
          <ol>${steps.map((t, i) => `<li style="--d:${(0.2 + i * 0.55).toFixed(2)}s"><i></i>${t}</li>`).join('')}</ol>
          <p class="fine" style="margin-top:40px">${esc(SITE.basis)} 역량 분류 기반</p>
          <p class="by">${esc(SITE.org)} × ${esc(SITE.partner)} 공동 개발</p>
        </div></main>`;
        return;
      }
      if (S.step === 'done') {
        app.innerHTML = `<main class="dark"><div class="wrap">
          <p class="org" style="letter-spacing:0;font-size:14px">${S.already ? '이미 제출했어요' : '제출 완료'}</p>
          <h1 class="h-md">${esc(S.name.trim() || inv.name)} 님의<br>결과지가 나왔어요</h1>
          <p class="lead">1장 ‘한눈에 보기’는 지금 바로 볼 수 있어요. 2장의 세부 점수·해석과 3장의 잠긴 내용은 <b style="color:#fff">1:1 상담에서 연구원이 직접 열어 설명</b>해 드려요.</p>
          ${S.pages
            ? `<div class="ptc-stack">${S.pages.map((p, i) => `<p class="ptc-label">${i + 1}장 · ${['한눈에 보기', '세부역량과 해석', '상담 안내'][i]}${i === 1 ? '<span>상담에서 공개</span>' : ''}</p><div class="ptc-fit"><div>${p}</div></div>`).join('')}</div>`
            : `<div class="card"><p style="margin:0;font-size:14px;color:#64748B">${S.resultErr ? esc(S.resultErr) : '결과지를 불러오는 중…'}</p></div>`}
          <p class="fine">이 진단은 ${esc(SITE.org)}와 상담 단체 ${esc(SITE.partner)}가 함께 만들었어요.<br>${esc(SITE.basis)} 역량 분류 기반 · ${Q.TOTAL}문항</p>
          ${inv.test ? `<a class="btn light" href="admin.html#/r/${encodeURIComponent(id)}" style="text-align:center;text-decoration:none">테스트 계정 · 전체 결과지 보기</a>
            <p class="fine" style="margin-top:8px">고객용 결과지 3장 전부와 상담사용 자료가 열려요 · 관리자 비밀번호 필요</p>
            <button class="btn ghost" data-act="retest">테스트 계정 · 처음부터 다시 해보기</button>` : ''}
        </div></main>`;
        fitPages();
        return;
      }
      // questions
      const start = S.page * PER_PAGE;
      const idx = Q.DISPLAY_ORDER.slice(start, Math.min(start + PER_PAGE, Q.TOTAL));
      const answered = S.answers.filter((a) => a !== null).length;
      const complete = idx.every((i) => S.answers[i] !== null);
      const last = S.page === PAGE_COUNT - 1;
      app.innerHTML = `<main>
        <div class="top"><div class="row"><span><span class="part">평소의 나</span>${S.page + 1} / ${PAGE_COUNT}</span><span>${answered} / ${Q.TOTAL}</span></div>
        <div class="bar"><i style="width:${Math.round(answered / Q.TOTAL * 100)}%"></i></div></div>
        <div class="qs">${inv.test ? '<div class="tfills"><button type="button" class="tfill" data-act="autofill">테스트 계정 · 이 페이지 자동 응답</button><button type="button" class="tfill" data-act="fillall">테스트 계정 · 한 번에 끝까지 (자동 응답 후 제출)</button></div>' : ''}${idx.map((i, k) => `<fieldset><legend><span class="no">${start + k + 1}</span>${esc(Q.questionText(i))}</legend>
          <div class="lk">${LIKERT.map(([v, l]) => `<button type="button" data-q="${i}" data-v="${v}" aria-pressed="${S.answers[i] === v}">${l.split('\n').map((x) => `<span>${x}</span>`).join('')}</button>`).join('')}</div></fieldset>`).join('')}
          ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}</div>
        <div class="nav"><div class="row">${S.page > 0 ? '<button class="prev" data-act="prev">이전</button>' : ''}<button class="next" data-act="next" ${!complete || S.busy ? 'disabled' : ''}>${S.busy ? '제출 중…' : last ? '제출하기' : '다음'}</button></div></div>
      </main>`;
    }

    async function submit() {
      const firstEmpty = Q.DISPLAY_ORDER.findIndex((i) => S.answers[i] === null);
      if (firstEmpty >= 0) { S.page = Math.floor(firstEmpty / PER_PAGE); S.err = '아직 응답하지 않은 문항이 있어 그 페이지로 이동했어요.'; draw(); return; }
      S.busy = true; S.err = ''; draw();
      try {
        const j = await api('submit', {
          id, clientName: S.name.trim(), status: S.status, interest: S.interest.trim(), researchConsent: S.research,
          answers: S.answers
        });
        clear(); S.already = !!j.already; S.busy = false;
        go('analyzing');
        await Promise.all([loadResult(), new Promise((r) => setTimeout(r, 2400))]);
        go('done');
      } catch (err) {
        // 앞선 제출이 서버에는 들어갔는데 응답만 늦었던 경우 — 제출된 것으로 보고 결과지를 보여준다
        if (err.message === '이미 제출된 검사입니다.') { clear(); S.busy = false; go('analyzing'); await loadResult(); go('done'); return; }
        S.busy = false; S.err = err.message; draw();
      }
    }

    app.oninput = (e) => {
      const t = e.target;
      if (t.id === 't-name') S.name = t.value;
      if (t.id === 't-int') S.interest = t.value;
      const b = app.querySelector('[data-go="questions"]');
      if (b) b.disabled = !(S.name.trim() && S.status && S.consent);
    };
    app.onchange = (e) => {
      const t = e.target;
      if (t.id === 't-consent') { S.consent = t.checked; draw(); }
      if (t.id === 't-research') S.research = t.checked;
    };
    app.onclick = (e) => {
      const t = e.target.closest('button,[data-go]');
      if (!t) return;
      if (t.dataset.go) { if (t.dataset.go === 'questions') save(); go(t.dataset.go); return; }
      if (t.dataset.status) { S.status = t.dataset.status; draw(); return; }
      if (t.dataset.q) {
        S.answers[+t.dataset.q] = +t.dataset.v; save();
        t.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
        const start = S.page * PER_PAGE;
        const idx = Q.DISPLAY_ORDER.slice(start, Math.min(start + PER_PAGE, Q.TOTAL));
        const n = app.querySelector('[data-act="next"]'); if (n) n.disabled = !idx.every((i) => S.answers[i] !== null);
        const answered = S.answers.filter((a) => a !== null).length;
        const top = app.querySelector('.top .row span:last-child'); if (top) top.textContent = `${answered} / ${Q.TOTAL}`;
        const bar = app.querySelector('.bar i'); if (bar) bar.style.width = Math.round(answered / Q.TOTAL * 100) + '%';
        return;
      }
      const act = t.dataset.act;
      if (act === 'more') { e.preventDefault(); S.open = !S.open; draw(); }
      else if (act === 'restart') { clear(); S.answers = Array(Q.TOTAL).fill(null); S.page = 0; S.resumable = 0; go('form'); }
      else if (act === 'autofill') {
        // 테스트 계정만: 지금 페이지의 빈 문항을 무작위로 채운다
        const start = S.page * PER_PAGE;
        Q.DISPLAY_ORDER.slice(start, Math.min(start + PER_PAGE, Q.TOTAL)).forEach((i) => { if (S.answers[i] === null) S.answers[i] = 1 + Math.floor(Math.random() * 5); });
        save(); draw();
      }
      else if (act === 'fillall') {
        // 테스트 계정만: 남은 문항을 한 유형이 뚜렷한 응답으로 채우고 바로 제출
        const sa = LLP.sampleAnswers(1 + Math.floor(Math.random() * 9));
        S.answers = S.answers.map((v, i) => (v === null ? sa[i] : v));
        S.page = PAGE_COUNT - 1; save(); submit();
      }
      else if (act === 'retest') {
        t.disabled = true; t.textContent = '처음으로 돌리는 중…';
        api('resetTest', { id }).then(() => { clear(); location.reload(); }, (err) => { t.disabled = false; t.textContent = err.message; });
      }
      else if (act === 'part2') { S.page = PART2_PAGE; save(); go('questions'); }
      else if (act === 'prev') { S.page -= 1; S.err = ''; save(); draw(); window.scrollTo(0, 0); }
      else if (act === 'next') {
        if (S.page === PAGE_COUNT - 1) { submit(); return; }
        if (S.page + 1 === PART2_PAGE) { save(); go('break'); return; }
        S.page += 1; S.err = ''; save(); draw(); window.scrollTo(0, 0);
      }
    };
    draw();
    if (S.step === 'done') loadResult().then(draw);
  }

})();
</script>
</body>
</html>
