<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>20대 핵심역량 진단 — LOGIN LAB 연구소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#13203F;--accent:#2F6BFF;--soft:#DCE7FF;--tint:#EAF0FF;--line:#D6DCE6;--sub:#5B6478;--faint:#8E96A8;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:16px}
button,input{font:inherit;color:inherit}
.dark{min-height:100vh;min-height:100dvh;background:var(--ink);color:#fff;padding:48px 24px}
.dark.center{display:flex;align-items:center}
.wrap{max-width:512px;margin:0 auto;width:100%}
.org{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--soft)}
h1{margin:0}
.h-xl{font-size:34px;font-weight:900;line-height:1.2;letter-spacing:-.02em;margin-top:20px}
.h-lg{font-size:30px;font-weight:900;line-height:1.25;letter-spacing:-.02em;margin-top:24px}
.h-md{font-size:28px;font-weight:900;line-height:1.3;margin-top:12px}
.lead{margin-top:14px;font-size:15px;line-height:1.65;color:rgba(255,255,255,.75)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:32px;text-align:center}
.stats div{background:rgba(255,255,255,.07);border-radius:16px;padding:16px 6px}
.stats b{display:block;font-size:24px;font-weight:900;color:var(--soft)}
.stats span{display:block;margin-top:4px;font-size:12px;color:rgba(255,255,255,.6)}
.card{margin-top:24px;background:#fff;color:#334155;border-radius:16px;padding:24px}
.card h2{margin:0;font-size:18px;font-weight:900;color:var(--ink)}
.card ol{margin:12px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.65}
.card li+li{margin-top:10px}
.card li b.n{color:var(--accent)}
.meet{margin-top:16px;border-radius:12px;padding:12px 16px;font-size:14px;background:var(--tint);color:var(--ink)}
.meet b{color:var(--accent);margin-right:8px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;min-height:52px}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.3;cursor:default}
.btn.light{background:var(--soft);color:var(--ink);margin-top:24px}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);margin-top:12px;font-size:14px;padding:14px}
.btn.ink{background:var(--ink);color:#fff;margin-top:32px}
.fine{margin-top:24px;text-align:center;font-size:12px;line-height:1.6;color:rgba(255,255,255,.45)}
.form{margin-top:32px}
.field+.field{margin-top:20px}
.lbl{display:block;font-size:14px;font-weight:700;color:#334155}
.lbl small{font-weight:400;color:#94A3B8;font-size:14px}

.chip[aria-pressed="true"]{background:var(--ink);border-color:transparent;color:#fff}

.agree label{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.6;color:#475569;cursor:pointer}
.agree input{margin-top:4px;width:16px;height:16px;flex:0 0 16px;accent-color:#13203F}
.agree b{color:#1E293B}
.agree .more{border:0;background:none;padding:0;margin-left:6px;font-size:12px;color:#64748B;text-decoration:underline;cursor:pointer}
.agree .note{display:block;font-size:12px;color:#94A3B8;margin-top:2px}
.detail{background:#fff;border-radius:8px;padding:12px;font-size:12px;line-height:1.6;color:#64748B;box-shadow:0 0 0 1px #F1F5F9}
.detail p{margin:0}.detail p+p{margin-top:6px}.detail b{color:#475569}
.err{margin-top:16px;border-radius:12px;background:#FEF2F2;color:#DC2626;padding:12px 16px;font-size:14px}
.light-page{min-height:100vh;background:#fff;padding:40px 24px}
.light-page h1{font-size:24px;font-weight:900;color:var(--ink)}
.light-page .desc{margin-top:8px;font-size:14px;color:#64748B}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid #E2E8F0;padding:12px 24px}
.top .row{max-width:512px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#64748B}
.top .part{background:var(--tint);color:var(--accent);border-radius:999px;padding:2px 8px;font-size:11px;margin-right:8px}
.bar{max-width:512px;margin:8px auto 0;height:6px;border-radius:9px;background:#F1F5F9;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent);transition:width .2s}
.qs{max-width:512px;margin:0 auto;padding:32px 24px 140px}
fieldset{border:0;margin:0;padding:0}
fieldset+fieldset{margin-top:32px}
legend{padding:0;font-size:16px;font-weight:600;line-height:1.45;color:var(--ink)}
legend .no{color:#CBD5E1;margin-right:8px}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.lk button{border:1px solid #E2E8F0;background:#fff;border-radius:12px;padding:12px 0;font-size:11px;font-weight:700;line-height:1.25;color:#64748B;cursor:pointer;min-height:48px}
.lk button span{display:block}
.lk button[aria-pressed="true"]{background:var(--ink);border-color:transparent;color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E2E8F0;padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px))}
.nav .row{max-width:512px;margin:0 auto;display:flex;gap:12px}
.nav button{border-radius:12px;padding:14px 24px;font-size:14px;font-weight:700;cursor:pointer;min-height:48px}
.nav .prev{border:1px solid #CBD5E1;background:#fff;color:#475569}
.nav .next{flex:1;border:0;background:var(--ink);color:#fff}
.nav .next:disabled{opacity:.3;cursor:default}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:rgba(255,255,255,.7);font-size:14px}
.white-card{margin-top:32px;background:#fff;color:var(--ink);border-radius:16px;padding:24px}
.white-card .lbl{color:var(--ink)}
</style>
</head>

        </form>
        <p class="fine">담당 연구원에게 받은 링크로 바로 들어와도 돼요.</p>
        ${configured ? '' : '<p class="err">설정 필요: index.html 맨 위의 API_URL 에 구글 Apps Script 웹 앱 주소를 넣어 주세요.</p>'}
      </div></main>`;
    };
    draw();
    app.oninput = (e) => {
      const t = e.target;
      const wasAdmin = st.name.trim() === SITE.adminName;
      if (t.id === 'e-name') st.name = t.value;
      if (t.id === 'e-phone') st.phone = t.value;
      if (t.id === 'e-pw') st.pw = t.value;
      st.err = '';
      const isAdmin = st.name.trim() === SITE.adminName;
      if (wasAdmin !== isAdmin) { draw(); const el = document.getElementById(isAdmin ? 'e-pw' : 'e-name'); el.focus(); if (!isAdmin) el.setSelectionRange(el.value.length, el.value.length); }
      else { const b = app.querySelector('button[type=submit]'); const ready = isAdmin ? st.pw.length > 0 : st.name.trim() && st.phone.replace(/\D/g, '').length >= 8; b.disabled = !ready; const er = app.querySelector('.err[role=alert]'); if (er) er.remove(); }
    };
    app.onsubmit = async (e) => {
      e.preventDefault();
      st.busy = true; st.err = ''; draw();
      try {
        if (st.name.trim() === SITE.adminName) {
          const j = await api('login', { password: st.pw });
          try { sessionStorage.setItem('ll_token', j.token); } catch (_) { /* 저장소를 못 쓰면 관리자 화면에서 다시 로그인 */ }
          location.href = 'admin.html';
          return;
        }
        const j = await api('find', { name: st.name.trim(), phone: st.phone });
        location.href = '?id=' + encodeURIComponent(j.id);
      } catch (err) {
        st.busy = false; st.err = err.message; draw();
      }
    };
  }

  /* ─── 검사 ───────────────────────────────────────────── */
  async function startTest(id) {
    let inv;
    try { inv = await api('invite', { id }); }
    catch (err) {
      app.innerHTML = `<main class="dark center"><div class="wrap"><p class="org">${esc(SITE.org)}</p><h1 class="h-md">검사 링크를 열 수 없어요</h1><p class="lead">${esc(err.message)}</p><a class="btn light" href="./" style="text-align:center;text-decoration:none">첫 화면으로</a></div></main>`;
      return;
    }
    const KEY = 'll-draft-' + id;
    const S = {
      step: inv.done ? 'done' : 'intro', name: inv.name, status: '', interest: '', consent: false, research: false, open: false,
      answers: Array(Q.INNER_TOTAL).fill(null), page: 0, busy: false, err: '', resumable: 0, already: inv.done
    };
    const meeting = meetText(inv.meeting);
    if (!inv.done) {
      try {
        const d = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (d && Array.isArray(d.answers) && d.answers.length === Q.INNER_TOTAL && Date.now() - d.savedAt < DRAFT_TTL) {
          const n = d.answers.filter((a) => a !== null).length;
          if (n) { S.answers = d.answers; S.page = Math.min(Math.max(d.page || 0, 0), PAGE_COUNT - 1); S.status = d.status || ''; S.interest = d.interest || ''; S.resumable = n; }
        }
      } catch (_) { /* 저장소를 못 쓰는 브라우저 */ }
    }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ savedAt: Date.now(), answers: S.answers, page: S.page, status: S.status, interest: S.interest })); } catch (_) { /* 무시 */ } };
    const clear = () => { try { localStorage.removeItem(KEY); } catch (_) { /* 무시 */ } };
    const go = (step) => { S.step = step; S.err = ''; draw(); window.scrollTo(0, 0); };

    function draw() {
      if (S.step === 'intro') {
        app.innerHTML = `<main class="dark"><div class="wrap">
          <p class="org">${esc(SITE.org)}</p>
          <h1 class="h-lg">${esc(S.name)} 님,<br>핵심역량 진단에<br>초대합니다</h1>
          <p class="lead">${esc(SITE.tagline)}</p>
          <div class="stats"><div><b>${Q.INNER_TOTAL}</b><span>문항</span></div><div><b>${SITE.minutes}분</b><span>소요 시간</span></div><div><b>1:1</b><span>결과 상담</span></div></div>
          <div class="card"><h2>이렇게 진행돼요</h2><ol>
            <li><b class="n">1.</b> 문장을 읽고 지금의 나에 가까운 정도를 고르면 돼요. 정답은 없어요.</li>
            <li><b class="n">2.</b> 결과는 화면에 나오지 않아요. <b>상담에서 연구원이 결과지를 직접 설명</b>해 드려요.</li></ol>
            ${meeting ? `<div class="meet"><b>상담 일정</b>${esc(meeting)}</div>` : ''}</div>
          ${S.resumable ? `<button class="btn light" data-go="form">이어서 하기 · ${S.resumable}/${Q.INNER_TOTAL} 응답함</button><button class="btn ghost" data-act="restart">처음부터 다시 하기</button>`
            : `<button class="btn light" data-go="form">시작하기</button>`}
          <p class="fine">응답은 안전하게 보관하며, 연구 활용에 동의한 경우에만<br>이름·연락처를 지운 뒤 통계로 분석합니다.</p>
        </div></main>`;
        return;
      }
      if (S.step === 'form') {
        const ok = S.name.trim() && S.status && S.consent;
        app.innerHTML = `<main class="light-page"><div class="wrap">
          <h1>간단한 정보</h1><p class="desc">결과지에 들어갈 정보예요. 1분이면 끝나요.</p>
          <div class="form">
            <div class="field"><label class="lbl" for="t-name">이름</label><input class="inp" id="t-name" maxlength="40" autocomplete="name" value="${esc(S.name)}"></div>
            <div class="field"><p class="lbl" style="margin:0">현재 상황</p><div class="chips">${Q.STATUS_OPTIONS.map((o) => `<button type="button" class="chip" data-status="${esc(o)}" aria-pressed="${S.status === o}">${esc(o)}</button>`).join('')}</div></div>
            <div class="field"><label class="lbl" for="t-int">관심 있는 직무·분야 <small>(선택)</small></label><input class="inp" id="t-int" maxlength="40" placeholder="예: 마케팅, 서비스 기획, 아직 모르겠음" value="${esc(S.interest)}"></div>
            <div class="agree">
              <label><input type="checkbox" id="t-consent" ${S.consent ? 'checked' : ''}><span><b>[필수]</b> 개인정보 수집·이용에 동의합니다.<button type="button" class="more" data-act="more">${S.open ? '접기' : '자세히'}</button></span></label>
              ${S.open ? `<div class="detail"><p><b>수집 항목</b> · 이름, 연락처, 현재 상황, 관심 직무, 검사 응답</p><p><b>이용 목적</b> · ${esc(SITE.org)} 결과지 제공, 1:1 결과 상담 일정 안내</p><p><b>보유·이용 기간</b> · ${esc(SITE.retention)}</p><p style="color:#94A3B8">동의를 거부할 수 있으나, 결과지 제공에 꼭 필요한 정보라 거부 시 진단이 제한됩니다.</p></div>` : ''}
              <label><input type="checkbox" id="t-research" ${S.research ? 'checked' : ''}><span><b>[선택]</b> 이름·연락처를 지운 응답을 20대 역량 연구(통계·논문)에 활용하는 데 동의합니다.<span class="note">동의하지 않아도 진단과 상담은 똑같이 받을 수 있어요.</span></span></label>
            </div>
          </div>
          <button class="btn ink" data-go="questions" ${ok ? '' : 'disabled'}>${S.resumable ? `이어서 하기 (${S.page + 1}/${PAGE_COUNT} 페이지)` : '검사 시작'}</button>
        </div></main>`;
        return;
      }
      if (S.step === 'break') {
        app.innerHTML = `<main class="dark center"><div class="wrap">
          <p class="org" style="letter-spacing:0;font-size:14px">1부 완료 · ${Q.COMP_TOTAL}문항</p>
          <h1 class="h-md">거의 다 왔어요!<br>남은 건 ${Q.INNER_TOTAL - Q.COMP_TOTAL}문항이에요</h1>
          <p class="lead">2부는 일이나 공부보다 <b style="color:#fff">평소의 나</b>에 관한 문장이에요. 깊이 고민하기보다 먼저 떠오르는 쪽을 고르면 돼요.</p>
          <button class="btn light" data-act="part2" style="margin-top:40px">2부 시작하기</button>
        </div></main>`;
        return;
      }
      if (S.step === 'done') {
        app.innerHTML = `<main class="dark center"><div class="wrap">
          <p class="org" style="letter-spacing:0;font-size:14px">${S.already ? '이미 제출했어요' : '제출 완료'}</p>
          <h1 class="h-md">${esc(S.name.trim() || inv.name)} 님,<br>응답이 저장되었어요</h1>
          <div class="card" style="margin-top:32px"><p style="margin:0;font-size:14px;line-height:1.65">결과는 <b>상담에서 연구원이 결과지와 함께 직접 설명</b>해 드려요.</p>
          ${meeting ? `<div class="meet"><b>상담 일정</b>${esc(meeting)}</div>` : '<p style="margin:12px 0 0;font-size:14px;color:#64748B">담당 연구원이 곧 연락드려 편한 일정을 정할게요.</p>'}
          <p style="margin:12px 0 0;font-size:14px;color:#64748B">화면에는 결과가 나오지 않으니 이 창은 닫으셔도 돼요.</p></div>
        </div></main>`;
        return;
      }
      // questions
      const start = S.page * PER_PAGE;
      const idx = Q.INNER_DISPLAY_ORDER.slice(start, Math.min(start + PER_PAGE, Q.INNER_TOTAL));
      const answered = S.answers.filter((a) => a !== null).length;
      const complete = idx.every((i) => S.answers[i] !== null);
      const last = S.page === PAGE_COUNT - 1;
      app.innerHTML = `<main>
        <div class="top"><div class="row"><span><span class="part">${S.page >= PART2_PAGE ? '2부 · 평소의 나' : '1부 · 일과 공부에서의 나'}</span>${S.page + 1} / ${PAGE_COUNT}</span><span>${answered} / ${Q.INNER_TOTAL}</span></div>
        <div class="bar"><i style="width:${Math.round(answered / Q.INNER_TOTAL * 100)}%"></i></div></div>
        <div class="qs">${idx.map((i, k) => `<fieldset><legend><span class="no">${start + k + 1}</span>${esc(Q.questionText(i))}</legend>
          <div class="lk">${LIKERT.map(([v, l]) => `<button type="button" data-q="${i}" data-v="${v}" aria-pressed="${S.answers[i] === v}">${l.split('\n').map((x) => `<span>${x}</span>`).join('')}</button>`).join('')}</div></fieldset>`).join('')}
          ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}</div>
        <div class="nav"><div class="row">${S.page > 0 ? '<button class="prev" data-act="prev">이전</button>' : ''}<button class="next" data-act="next" ${!complete || S.busy ? 'disabled' : ''}>${S.busy ? '제출 중…' : last ? '제출하기' : '다음'}</button></div></div>
      </main>`;
    }

    async function submit() {
      const firstEmpty = Q.INNER_DISPLAY_ORDER.findIndex((i) => S.answers[i] === null);
      if (firstEmpty >= 0) { S.page = Math.floor(firstEmpty / PER_PAGE); S.err = '아직 응답하지 않은 문항이 있어 그 페이지로 이동했어요.'; draw(); return; }
      S.busy = true; S.err = ''; draw();
      try {
        const j = await api('submit', {
          id, clientName: S.name.trim(), status: S.status, interest: S.interest.trim(), researchConsent: S.research,
          compAnswers: S.answers.slice(0, Q.COMP_TOTAL), ennAnswers: S.answers.slice(Q.INNER_ENN_OFFSET)
        });
        clear(); S.already = !!j.already; S.busy = false; go('done');
      } catch (err) { S.busy = false; S.err = err.message; draw(); }
    }

    app.oninput = (e) => {
      const t = e.target;
      if (t.id === 't-name') S.name = t.value;
      if (t.id === 't-int') S.interest = t.value;
      const b = app.querySelector('[data-go="questions"]');
      if (b) b.disabled = !(S.name.trim() && S.status && S.consent);
    };
    app.onchange = (e) => {
      const t = e.target;
      if (t.id === 't-consent') { S.consent = t.checked; draw(); }
      if (t.id === 't-research') S.research = t.checked;
    };
    app.onclick = (e) => {
      const t = e.target.closest('button,[data-go]');
      if (!t) return;
      if (t.dataset.go) { if (t.dataset.go === 'questions') save(); go(t.dataset.go); return; }
      if (t.dataset.status) { S.status = t.dataset.status; draw(); return; }
      if (t.dataset.q) {
        S.answers[+t.dataset.q] = +t.dataset.v; save();
        t.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
        const start = S.page * PER_PAGE;
        const idx = Q.INNER_DISPLAY_ORDER.slice(start, Math.min(start + PER_PAGE, Q.INNER_TOTAL));
        const n = app.querySelector('[data-act="next"]'); if (n) n.disabled = !idx.every((i) => S.answers[i] !== null);
        const answered = S.answers.filter((a) => a !== null).length;
        const top = app.querySelector('.top .row span:last-child'); if (top) top.textContent = `${answered} / ${Q.INNER_TOTAL}`;
        const bar = app.querySelector('.bar i'); if (bar) bar.style.width = Math.round(answered / Q.INNER_TOTAL * 100) + '%';
        return;
      }
      const act = t.dataset.act;
      if (act === 'more') { e.preventDefault(); S.open = !S.open; draw(); }
      else if (act === 'restart') { clear(); S.answers = Array(Q.INNER_TOTAL).fill(null); S.page = 0; S.resumable = 0; go('form'); }
      else if (act === 'part2') { S.page = PART2_PAGE; save(); go('questions'); }
      else if (act === 'prev') { S.page -= 1; S.err = ''; save(); draw(); window.scrollTo(0, 0); }
      else if (act === 'next') {
        if (S.page === PAGE_COUNT - 1) { submit(); return; }
        if (S.page + 1 === PART2_PAGE) { save(); go('break'); return; }
        S.page += 1; S.err = ''; save(); draw(); window.scrollTo(0, 0);
      }
    };
    draw();
  }
})();
</script>
</body>
</html>
