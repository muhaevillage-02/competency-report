<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13203F">
<title>관리자 — LOGIN LAB 연구소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#13203F;--ink2:#25366A;--accent:#2F6BFF;--asoft:#EAF0FF;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F8FAFC;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:16px}
button,input,textarea{font:inherit;color:inherit}
.a-hdr{background:var(--ink)}
.a-hin{max-width:1152px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px}
.a-logo{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none}
.a-logo i{width:28px;height:28px;border-radius:6px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:900}
.a-logo b{font-size:14px}
.a-logo small{font-size:11px;color:rgba(255,255,255,.4)}
.a-hact{display:flex;align-items:center;gap:16px}
.a-hlink{font-size:14px;color:rgba(255,255,255,.7);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.a-hlink:hover{color:#fff}
.a-csv{display:none}
@media(min-width:640px){.a-csv{display:inline}}
.a-out{border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 16px;font-size:14px;font-weight:500;color:rgba(255,255,255,.7);background:none;cursor:pointer}
.a-out:hover{border-color:rgba(255,255,255,.4);color:#fff}
.a-main{max-width:1152px;margin:0 auto;padding:32px 16px}
.a-h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.a-desc{margin:4px 0 0;font-size:14px;color:#64748B}
.a-strong{color:#334155}
.a-ul{margin-left:8px;color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.a-ml{margin-left:12px}
.a-layout{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media(min-width:1024px){.a-layout{grid-template-columns:360px minmax(0,1fr);align-items:start}.a-issue{position:sticky;top:16px}}
.a-box{min-width:0;background:#fff;border-radius:16px;padding:20px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.a-box h2{margin:0;font-size:16px;font-weight:800}
.a-form{margin-top:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.a-s2{grid-column:span 2}
.a-lbl{display:block;margin-bottom:4px;font-size:12px;font-weight:700;color:#64748B}
.a-lbl small{font-size:12px;font-weight:400;color:#94A3B8}
.a-inp{width:100%;min-width:0;border:1px solid #CBD5E1;border-radius:12px;background:#fff;padding:10px 14px;font-size:15px;outline:none;color:var(--ink)}
.a-inp:focus{border-color:#0F172A}
textarea.a-inp{min-height:64px;resize:vertical}
.a-inp[type="date"],.a-inp[type="time"],.a-tbdbox{height:44px}
.a-tbdbox{display:flex;align-items:center;background:#F1F5F9;border-color:#E2E8F0;color:#64748B;font-weight:600}
.a-lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.a-lrow .a-lbl{margin-bottom:0}
.a-tbd{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#64748B;cursor:pointer}
.a-tbd input{width:14px;height:14px;margin:0;accent-color:#13203F;cursor:pointer}
.a-tbd:has(input:disabled){opacity:.5;cursor:default}
.a-submit{border:0;border-radius:12px;background:var(--ink);color:#fff;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
.a-submit:hover{background:var(--ink2)}
.a-err{margin:0;border-radius:12px;background:#FEF2F2;color:#DC2626;padding:12px;font-size:14px}
.a-issued{margin-top:16px;border-radius:12px;background:var(--asoft);padding:16px;font-size:14px}
.a-issued p{margin:0}
.a-mono{margin-top:8px!important;word-break:break-all;border-radius:8px;background:#fff;padding:8px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#475569}
.a-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.a-sm{display:inline-block;border:1px solid #E2E8F0;border-radius:8px;background:#fff;padding:8px 12px;font-size:12px;font-weight:700;color:#475569;text-decoration:none;cursor:pointer}
.a-sm.ink{background:var(--ink);border-color:transparent;color:#fff}
.a-sm.red{border-color:#FECACA;color:#DC2626}
.a-sm.redf{background:#DC2626;border-color:transparent;color:#fff}
.a-filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.a-chip{border:0;border-radius:999px;background:#F1F5F9;padding:6px 14px;font-size:14px;font-weight:700;color:#64748B;cursor:pointer}
.a-chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.a-chip span{margin-left:2px;font-weight:500;opacity:.7}
.a-search{margin-left:auto;width:100%;border:1px solid #E2E8F0;border-radius:12px;background:#F8FAFC;padding:8px 14px;font-size:14px;outline:none}
.a-search:focus{border-color:#94A3B8}
@media(min-width:640px){.a-search{width:224px}}
.a-empty{padding:64px 0;text-align:center;font-size:14px;color:#94A3B8}
.a-rows{list-style:none;margin:16px 0 0;padding:0}
.a-rows>li{padding:16px 0;border-top:1px solid #F1F5F9}
.a-rows>li:first-child{border-top:0}
.a-prow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 16px}
.a-pinfo{min-width:0;flex:1}
@media(max-width:639px){.a-pinfo{flex-basis:100%}}
.a-pinfo p{margin:4px 0 0;font-size:14px;color:#64748B}
.a-pinfo .a-pname{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.a-pname b{font-size:15px;font-weight:800;color:var(--ink)}
.a-bdg{border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.a-bdg.done{background:#ECFDF5;color:#047857}
.a-bdg.wait{background:#FFFBEB;color:#B45309}
.a-bdg.warn{background:#FEF2F2;color:#DC2626}
.a-bdg.test{background:#F1F5F9;color:#64748B}
.a-rno{font-size:12px;color:#94A3B8}
.a-key{margin-right:6px;font-weight:700;color:#94A3B8}
.a-meet{font-weight:600;color:#334155}
.a-none{color:#94A3B8}
.a-pinfo .a-memo{font-size:12px;color:#94A3B8}
.a-pact{display:flex;flex-wrap:wrap;gap:6px}
.a-edit{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-radius:12px;background:#F8FAFC;padding:16px}
.a-edit .a-w2,.a-edit .a-w4{grid-column:span 2}
@media(min-width:640px){.a-edit{grid-template-columns:repeat(4,minmax(0,1fr))}.a-edit .a-w4{grid-column:span 4}}
.a-ebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.a-ebar .a-save{border:0;border-radius:8px;background:var(--ink);color:#fff;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}
.a-hint{font-size:12px;color:#94A3B8}
.a-grow{margin-left:auto}
.a-confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:#DC2626}
.a-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;border-radius:12px;background:#0F172A;color:#fff;padding:10px 16px;font-size:14px;font-weight:700;box-shadow:0 10px 15px -3px rgba(0,0,0,.2)}
.a-rhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 16px}
.a-rhead span{font-size:14px;color:#64748B}
.a-tools{margin-top:24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.a-tabs{display:flex;border-radius:12px;background:#fff;padding:4px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.a-tabs button{border:0;border-radius:8px;background:none;padding:8px 16px;font-size:14px;font-weight:700;color:#64748B;cursor:pointer}
.a-tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.a-tabs button.vio[aria-selected="true"]{background:#6C4CF1}
.a-tabs button.teal[aria-selected="true"]{background:#0E8A9A}
.a-tabs button:disabled{opacity:.4;cursor:default}
.a-big{border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer}
.a-big.ink{border:0;background:var(--ink);color:#fff}
.a-big.line{border:1px solid #CBD5E1;background:#fff;color:#334155}
.a-cap{margin:8px 0 0;font-size:12px;color:#94A3B8}
.a-pages{margin-top:16px;display:grid;gap:16px}
.a-thumb{border:0;background:none;padding:0;text-align:left;cursor:zoom-in}
.a-thumb small{display:block;margin-top:6px;font-size:12px;color:#64748B}
.a-pg{position:relative;overflow:hidden;border-radius:12px;background:#F3F5FA;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.05)}
.a-pg>div{position:absolute;left:0;top:0;transform-origin:0 0}
.a-prep{margin-top:32px}
.a-prep h2{margin:0;font-size:18px;font-weight:800}
.a-prep h2 small{margin-left:4px;font-size:14px;font-weight:500;color:#94A3B8}
.a-prepin{margin-top:12px;display:grid;gap:12px}
.a-notyet{margin-top:32px;border-radius:16px;background:#fff;padding:40px;text-align:center;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.a-notyet .a-nt{margin:0;font-size:18px;font-weight:700}
.a-notyet .a-ns{margin:8px 0 0;font-size:14px;color:#64748B}
.a-notyet .a-sm{margin-top:16px}
.a-present{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#0B0F19;padding:12px;color:#F1F5F9}
.a-ptop{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.a-ptop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-pbtn{border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.1);padding:8px 16px;font-weight:700;color:#F1F5F9;cursor:pointer}
.a-pbtn:disabled{opacity:.3;cursor:default}
.a-stage{display:grid;place-items:center;overflow:hidden}
.a-pnav{display:flex;align-items:center;justify-content:center;gap:16px;padding-top:8px}
.a-dots{display:flex;gap:6px}
.a-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.a-dots i.on{background:#fff}

.cg-sum{background:#fff;border:1px solid #E3E7EF;border-left:4px solid #6C4CF1;border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.6;color:#2E3648}
.cg-sumt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.cg-sumt span{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:#EFEAFF;color:#5B3FD9}
.cg-sumt b{font-weight:800;color:#141B2D}
.cg-sumt em{font-style:normal;font-size:12.5px;color:#6B7488}
.cg-sum p{margin:6px 0 0}
.cg-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:760px){.cg-cards{grid-template-columns:minmax(0,1fr)}}
.cg-card{min-width:0;background:#fff;border:1px solid #E3E7EF;border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.6;color:#2E3648}
.cg-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cg-h b{font-size:14px;font-weight:800;color:#141B2D}
.cg-h small{margin-left:auto;font-size:11px;color:#94A3B8;white-space:nowrap}
.cg-no{flex:0 0 22px;width:22px;height:22px;border-radius:7px;background:#EEF3FF;color:#2F6BFF;font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.cg-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid #EEF0F5}
.cg-k{padding-top:2px;font-size:11.5px;font-weight:800;color:#6B7488}
.cg-row.say>div{border-radius:10px;background:#F5F3FB;padding:8px 10px;color:#3B2F73}
.cg-row.ask>div{font-weight:700;color:#B4620E}
.cg-sub{display:block;margin-top:4px;font-size:12px;color:#6B7488}
.cg-sc{margin-left:4px;font-size:11px;font-weight:800;color:#2F6BFF}
.cg-ol{margin:0;padding-left:18px}
.cg-ol li+li{margin-top:4px}
.cg-ol .rp-bdg{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;margin-left:4px}
.cg-items{margin-top:6px}
.cg-quotes q,.cg-tab q{display:block;margin-top:4px;padding:6px 10px;border-left:3px solid #C9BEF7;border-radius:0 8px 8px 0;background:#FAF9FE;font-size:12.5px;color:#3A4357}
.cg-contest h4 small{margin-left:4px;font-size:12px;font-weight:500;color:#94A3B8}
.cg-buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:760px){.cg-buckets{grid-template-columns:minmax(0,1fr)}}
.cg-b{border-radius:10px;padding:10px 12px;font-size:12.5px}
.cg-b b{display:block;font-size:13px}
.cg-b span{display:block;font-size:11.5px;opacity:.8}
.cg-b p{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px}
.cg-chip{border-radius:999px;background:rgba(255,255,255,.75);padding:2px 9px;font-size:12px;font-weight:700}
.cg-chip b{margin-left:2px;font-weight:800;opacity:.7}
.cg-none{font-size:12px;opacity:.6}
.cg-b.ok{background:#E9F7F1;color:#1F4A3C}
.cg-b.hid{background:#EFEAFF;color:#3B2F73}
.cg-b.ask{background:#FFF5E6;color:#4A3A28}
.cg-tab{width:100%;margin-top:10px;border-collapse:collapse;font-size:12.5px}
.cg-tab td{padding:8px 6px;border-top:1px solid #EEF0F5;vertical-align:top}
.cg-tab td:first-child{width:170px;font-weight:700}
.cg-tab q:first-child{margin-top:0}
@media(max-width:560px){.cg-tab td{display:block;width:auto!important;border-top:0;padding:4px 0}.cg-tab tr{display:block;border-top:1px solid #EEF0F5;padding:6px 0}}
.cg-ai{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px}
.cg-ai button{border:0;border-radius:10px;background:#6C4CF1;color:#fff;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer}
.cg-ai span{font-size:12px;color:#6B7488}
.cg-raw{margin-top:10px;font-size:12.5px}
.cg-raw summary{cursor:pointer;font-weight:700;color:#6B7488}
.cg-raw div{margin-top:6px;max-height:320px;overflow:auto;border-radius:10px;background:#F8FAFC;padding:10px 12px;line-height:1.7}

.a-gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:24px 16px}
.a-gate form{width:100%;max-width:380px;border-radius:16px;background:#fff;padding:28px 24px}
.a-gorg{margin:0;font-size:12px;font-weight:700;letter-spacing:.18em;color:#64748B}
.a-gate h1{margin:10px 0 0;font-size:22px;font-weight:800}
.a-gd{margin:6px 0 0;font-size:14px;color:#64748B}
.a-gate .a-inp{margin-top:16px}
.a-gate .a-err{margin-top:12px}
.a-gate .a-submit{width:100%;margin-top:16px}
.a-gate .a-submit:disabled{opacity:.5;cursor:default}
.a-gback{display:block;margin-top:14px;text-align:center;font-size:13px;color:#64748B}
.a-gwait{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.7);font-size:14px}
.a-gwait::before{content:'';width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:a-spin .8s linear infinite}
@keyframes a-spin{to{transform:rotate(360deg)}}
.a-sync{font-size:12px;color:rgba(255,255,255,.55)}
#inner-print{display:none}
@media print{
  @page{size:540px 960px;margin:0}
  html.inner-printing body>*:not(#inner-print){display:none!important}
  html.inner-printing #inner-print{display:block}
  #inner-print .rp-page{break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #inner-print>div:last-child .rp-page{break-after:auto;page-break-after:auto}
}


.rp-page{width:540px;height:960px;position:relative;overflow:hidden;background:#F3F5FA;color:#1A2233;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;letter-spacing:-0.2px;-webkit-font-smoothing:antialiased;line-height:normal;font-size:14px;text-align:left}
.rp-page *{box-sizing:border-box;margin:0;padding:0}
.rp-page b{font-weight:800}
.rp-pad{padding:0 28px}
.rp-pageno{position:absolute;bottom:18px;right:28px;font-size:11px;color:#9AA3B5;letter-spacing:1px}
.rp-brand{position:absolute;bottom:18px;left:28px;font-size:11px;color:#9AA3B5;font-weight:700;letter-spacing:.5px}
.rp-eyebrow{font-size:12px;font-weight:800;color:#2F6BFF;letter-spacing:1.5px}
.rp-h2{font-size:24px;font-weight:800;line-height:1.35;margin-top:6px;color:#1A2233}
.rp-card{background:#FFFFFF;border-radius:18px;box-shadow:0 1px 0 rgba(19,32,63,.04),0 6px 20px rgba(19,32,63,.06)}
.rp-muted{color:#5B6478}
.rp-hero{background:linear-gradient(160deg,#13203F 0%,#1E3264 100%);color:#FFFFFF;padding:32px 28px 30px;height:436px;position:relative}
.rp-inst{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;opacity:.92}
.rp-inst i{width:22px;height:22px;border-radius:6px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;color:#13203F;font-style:normal;font-size:12px;font-weight:900}
.rp-tag{display:inline-block;margin-top:26px;font-size:12px;font-weight:700;padding:5px 10px;border:1px solid rgba(255,255,255,.35);border-radius:999px;opacity:.9}
.rp-hero h1{font-size:32px;line-height:1.3;font-weight:900;margin-top:12px;letter-spacing:-0.8px}
.rp-hero h1 .nm{color:#9CC0FF}
.rp-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:22px;font-size:12.5px}
.rp-meta div{font-weight:700}
.rp-meta span{display:block;opacity:.6;font-size:11px;margin-bottom:2px;font-weight:500}
.rp-method{margin:-28px 20px 0;padding:22px 22px 8px;position:relative}
.rp-method h3{font-size:17px;font-weight:800}
.rp-lead{font-size:12.5px;color:#5B6478;margin-top:4px;line-height:1.5}
.rp-step{display:flex;gap:12px;padding:12px 0;border-top:1px solid #E3E7EF}
.rp-step.first{border-top:none}
.rp-step .n{flex:0 0 26px;height:26px;border-radius:8px;background:#EEF3FF;color:#2F6BFF;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.rp-step .t{font-size:14px;font-weight:800}
.rp-step .d{font-size:12.3px;color:#5B6478;line-height:1.5;margin-top:2px}
.rp-rel{margin:14px 20px 0;padding:14px 18px;display:flex;align-items:center;gap:12px}
.rp-rel .dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.rp-rel .t{font-size:13.5px;font-weight:800}
.rp-rel .d{font-size:12px;color:#5B6478;margin-top:1px}
.rp-research{margin:14px 22px 0;font-size:11.2px;line-height:1.6;color:#7A8398;display:flex;gap:8px}
.rp-research svg{flex:0 0 14px;margin-top:3px}
.rp-top{padding-top:34px}
.rp-type{margin:18px 20px 0;padding:22px;background:linear-gradient(150deg,#1E3264,#2F6BFF);color:#FFFFFF;border-radius:18px}
.rp-type .l{font-size:12px;font-weight:700;opacity:.8}
.rp-type .nm{font-size:25px;font-weight:900;line-height:1.3;margin-top:6px;letter-spacing:-0.6px}
.rp-type .ds{font-size:12.8px;line-height:1.55;margin-top:10px;opacity:.92}
.rp-scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 20px 0}
.rp-scores .rp-card{padding:14px 16px}
.rp-scores .l{font-size:11.5px;color:#5B6478;font-weight:700}

<script>
/* 관리자 화면 본체(결과지·상담 자료 포함)는 관리자 비밀번호로 암호화돼 있다 (AES-GCM · PBKDF2-SHA256).
   맞는 비밀번호를 넣으면 이 브라우저 안에서만 풀려 실행된다. */
(function () {
  'use strict';
  const app = document.getElementById('app');
  const P = JSON.parse(document.getElementById('ll-payload').textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  // 잠금을 푸는 동안 명단을 미리 요청해 둔다 (첫 화면에서 로그인해 토큰이 있을 때)
  try {
    const tok = sessionStorage.getItem('ll_token');
    const c = JSON.parse(sessionStorage.getItem('ll_rows') || 'null');
    const fresh = c && c.login && Date.now() - c.at < 30000; // 로그인 때 방금 받은 명단이 있으면 다시 묻지 않는다
    if (tok && !fresh) window.__llPrefetch = fetch('https://script.google.com/macros/s/AKfycbxsI8A_Zs8gJnGjvcg3FwpFyVjd5m9wlqeIJcLD1dJlT98voVT3cMHGpBE_9x09fTVtGQ/exec', { method: 'POST', body: JSON.stringify({ action: 'list', token: tok }) }).then((r) => r.json()).catch(() => null);
  } catch (_) { /* 무시 */ }

  async function unlock(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)));
  }
  async function open(pw) {
    let code;
    try { code = await unlock(pw); } catch (_) { return false; }
    try { sessionStorage.setItem('ll_pw', pw); } catch (_) { /* 저장소를 못 쓰면 다음에 다시 입력 */ }
    const s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
    return true;
  }
  function gate(err) {
    document.title = '관리자 확인 — LOGIN LAB 연구소';
    app.innerHTML = `<main class="a-gate"><form id="gate" novalidate>
      <p class="a-gorg">LOGIN LAB 연구소</p><h1>관리자 확인</h1>
      <p class="a-gd">관리자 비밀번호를 넣으면 관리 화면이 열려요.</p>
      <input class="a-inp" id="gate-pw" type="password" autocomplete="current-password" aria-label="관리자 비밀번호">
      ${err ? `<p class="a-err" role="alert">${err}</p>` : ''}
      <button class="a-submit" type="submit">열기</button>
      <a class="a-gback" href="./">첫 화면으로</a></form></main>`;
    const input = document.getElementById('gate-pw');
    input.focus();
    document.getElementById('gate').onsubmit = async (e) => {
      e.preventDefault();
      const b = e.target.querySelector('button');
      b.disabled = true; b.textContent = '여는 중…';
      if (!(await open(input.value))) gate('비밀번호가 맞지 않아요.');
    };
  }

  if (!window.crypto || !crypto.subtle) { gate('이 브라우저에서는 관리자 화면을 열 수 없어요. https 주소로 열어 주세요.'); return; }
  let pw = null;
  try { pw = sessionStorage.getItem('ll_pw'); } catch (_) { /* 무시 */ }
  if (!pw) { gate(''); return; }
  app.innerHTML = '<main class="a-gate"><p class="a-gwait">여는 중…</p></main>';
  open(pw).then((ok) => {
    if (ok) return;
    try { sessionStorage.removeItem('ll_pw'); } catch (_) { /* 무시 */ }
    gate('비밀번호가 맞지 않아요. 다시 넣어 주세요.');
  });
})();
</script>
